<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <title>레지나 레노먼드 그랑따블로</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>레지나 레노먼드 그랑따블로</h1>
      <p class="desc">질문 입력 없이 36장 그랑따블로를 펼치고, 카드 이름·시그니피케이터 위치·인접 연결·대각선 흐름을 정리합니다.</p>

      <div class="controls">
        <div class="field">
          <label for="deckSelect">덱</label>
          <select id="deckSelect" disabled>
            <option>레노먼드 36장</option>
          </select>
        </div>

        <div class="field">
          <label for="shuffleMode">셔플 방식</label>
          <select id="shuffleMode">
            <option value="full">완전 랜덤</option>
            <option value="cut">컷 포함 셔플</option>
            <option value="number">번호 지정 추출</option>
          </select>
          <div id="numberSelectBox" class="number-select-box">
            <input id="numberInput" type="text" placeholder="1~36 숫자를 쉼표로 입력. 예: 3,7,12,25" />
          </div>
        </div>

        <fieldset class="check-group field">
          <legend>표시 옵션</legend>
          <div class="check-grid">
            <label class="inline"><input id="showHouses" type="checkbox" checked /> 하우스 표시</label>
            <label class="inline"><input id="highlightSig" type="checkbox" checked /> 시그니피케이터 강조</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="question">질문(선택)</label>
          <input id="question" type="text" placeholder="저장할 질문을 입력하세요." />
        </div>

        <div class="field">
          <label for="memo">메모(선택)</label>
          <input id="memo" type="text" placeholder="저장할 메모를 입력하세요." />
        </div>

        <div class="field">
          <button id="generateBtn" class="primary">그랑따블로 펼치기</button>
          <button id="saveBtn" class="secondary" type="button">현재 배치 저장</button>
        </div>
      </div>
    </div>

    <div class="section panel">
      <div class="grid-title">
        <strong>그랑따블로 배치</strong>
        <span id="statusText" class="desc">아직 펼쳐지지 않았어요.</span>
      </div>
      <div id="spreadContainer">
        <div class="empty">상단 버튼을 눌러 36장 그랑따블로를 펼쳐주세요.</div>
      </div>
    </div>

    <div class="section panel">
      <div class="grid-title">
        <strong>구조 정보</strong>
        <button id="extraToggleBtn" class="secondary" type="button">확장 보기</button>
      </div>
      <div id="resultContainer" class="result-grid">
        <div class="empty">배치를 생성하면 시그니피케이터 위치, 인접 주요 연결, 대각선 흐름이 표시됩니다.</div>
      </div>
      <div id="extraResultContainer" class="extra-result hidden"></div>
    </div>

    <div class="section panel">
      <div class="grid-title">
        <strong>최근 저장 배치</strong>
      </div>
      <div id="historyContainer" class="history-list">
        <div class="empty">저장된 배치가 없습니다.</div>
      </div>
    </div>

    <div class="section panel">
      <div class="grid-title">
        <strong>AI 복사용 결과</strong>
        <button id="copyBtn" class="secondary">복사하기</button>
      </div>
      <textarea id="copyOutput" class="copy-area" readonly placeholder="배치를 생성하면 복사본이 여기에 정리됩니다."></textarea>
    </div>
  </div>

  <script type="module" src="js/lenormandMode.js"></script>
</body>
</html>
