<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>레지나 리딩 보조앱</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:#12182b;
      --line:#2a3658;
      --text:#eef2ff;
      --muted:#9aa6c7;
      --accent:#8b5cf6;
      --accent2:#6366f1;
      --ok:#22c55e;
      --warn:#f59e0b;
      --danger:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      background:linear-gradient(180deg,#0a0f1d,#10172a);
      color:var(--text);
      font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    }
    .app{
      max-width:1100px;
      margin:0 auto;
      padding:24px;
    }
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:20px;
      flex-wrap:wrap;
    }
    .title{
      font-size:28px;
      font-weight:800;
      margin:0 0 6px;
    }
    .sub{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }
    .panel{
      background:rgba(18,24,43,.96);
      border:1px solid var(--line);
      border-radius:20px;
      padding:18px;
      box-shadow:0 12px 40px rgba(0,0,0,.22);
      margin-bottom:16px;
    }
    .grid{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:16px;
    }
    .field{
      display:grid;
      gap:6px;
      margin-bottom:14px;
    }
    .field label{
      font-size:13px;
      color:var(--muted);
    }
    .input,.textarea,.select{
      width:100%;
      background:#0d1428;
      color:var(--text);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 14px;
      outline:none;
    }
    .textarea{
      min-height:120px;
      resize:vertical;
      line-height:1.65;
    }
    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .btn{
      border:1px solid var(--line);
      background:#1a2440;
      color:var(--text);
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      text-decoration:none;
    }
    .btn:hover{filter:brightness(1.08)}
    .btn.primary{
      background:linear-gradient(180deg,var(--accent),var(--accent2));
      border-color:transparent;
    }
    .btn.ok{
      background:rgba(34,197,94,.15);
      border-color:rgba(34,197,94,.4);
    }
    .btn.warn{
      background:rgba(245,158,11,.15);
      border-color:rgba(245,158,11,.4);
    }
    .btn.danger{
      background:rgba(239,68,68,.15);
      border-color:rgba(239,68,68,.4);
    }
    .muted{color:var(--muted)}
    .status{
      margin-top:12px;
      padding:10px 12px;
      border-radius:12px;
      font-size:13px;
      white-space:pre-wrap;
      line-height:1.6;
      border:1px solid var(--line);
      background:#10182c;
      display:none;
    }
    .status.show{display:block}
    .status.ok{border-color:rgba(34,197,94,.4);color:#bbf7d0}
    .status.error{border-color:rgba(239,68,68,.4);color:#fecaca}
    .status.warn{border-color:rgba(245,158,11,.4);color:#fde68a}
    .meta-box{
      display:grid;
      grid-template-columns:120px 1fr;
      gap:10px;
      font-size:14px;
      line-height:1.7;
    }
    .meta-box + .meta-box{margin-top:8px}
    .help{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
      line-height:1.6;
    }
    .result-box{
      white-space:pre-wrap;
      line-height:1.75;
      font-size:14px;
      background:#0d1428;
      border:1px solid var(--line);
      border-radius:12px;
      padding:14px;
      min-height:180px;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:4px 8px;
      font-size:11px;
      font-weight:800;
      border:1px solid var(--line);
      background:rgba(99,102,241,.12);
      color:#c7d2fe;
    }
    @media (max-width:900px){
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div>
        <h1 class="title">레지나 리딩 보조앱</h1>
        <p class="sub">상담 접수 1건을 불러와 추천 / 드로우 / 최종 리딩을 한 화면에서 정리합니다.</p>
      </div>
      <div class="toolbar">
        <a class="btn" href="/admin2.html" target="_blank" rel="noopener noreferrer">관리자 열기</a>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2 style="margin-top:0;">선택된 상담 정보</h2>
        <div id="consultationInfo" class="muted">상담 정보를 불러오는 중입니다.</div>
        <div id="infoStatus" class="status"></div>
      </section>

      <section class="panel">
        <h2 style="margin-top:0;">자동 실행</h2>
        <div class="field">
          <label>현재 상태</label>
          <div id="autoRunState" class="badge">대기</div>
        </div>
        <div class="toolbar">
          <button class="btn primary" id="loadBtn" type="button">상담 다시 불러오기</button>
          <button class="btn warn" id="autorunBtn" type="button">추천 → 드로우 자동 실행</button>
        </div>
        <p class="help">URL에 <code>?id=상담ID&autorun=1</code> 이 있으면 자동 실행됩니다.</p>
      </section>
    </div>

    <section class="panel">
      <h2 style="margin-top:0;">추천 결과</h2>
      <div class="field">
        <label for="recommendationText">추천 텍스트</label>
        <textarea id="recommendationText" class="textarea"></textarea>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="generateRecommendationBtn" type="button">추천 생성</button>
        <button class="btn ok" id="saveRecommendationBtn" type="button">추천 저장</button>
      </div>
      <div id="recommendationStatus" class="status"></div>
    </section>

    <section class="panel">
      <h2 style="margin-top:0;">드로우 결과</h2>
      <div class="field">
        <label for="drawResultText">드로우 텍스트</label>
        <textarea id="drawResultText" class="textarea"></textarea>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="autoDrawBtn" type="button">자동 드로우</button>
        <button class="btn ok" id="saveDrawBtn" type="button">드로우 저장</button>
      </div>
      <div id="drawStatus" class="status"></div>
    </section>

    <section class="panel">
      <h2 style="margin-top:0;">최종 리딩</h2>
      <div class="field">
        <label for="finalReadingText">최종 리딩 텍스트</label>
        <textarea id="finalReadingText" class="textarea" style="min-height:220px;"></textarea>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="generateFinalReadingBtn" type="button">최종 리딩 생성</button>
        <button class="btn ok" id="saveFinalReadingBtn" type="button">최종 리딩 저장</button>
      </div>
      <div id="readingStatus" class="status"></div>
    </section>

    <section class="panel">
      <h2 style="margin-top:0;">카톡 전달 문구</h2>
      <div class="field">
        <label for="kakaoText">전달용 문구</label>
        <textarea id="kakaoText" class="textarea" style="min-height:180px;"></textarea>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="generateKakaoBtn" type="button">카톡 문구 생성</button>
        <button class="btn" id="copyKakaoBtn" type="button">복사</button>
      </div>
      <div id="kakaoStatus" class="status"></div>
    </section>
  </div>

  <script>
    const qs = new URLSearchParams(location.search);
    const consultationId = qs.get('id') || '';
    const shouldAutorun = qs.get('autorun') === '1';

    const state = {
      consultation: null,
      consultationId,
    };

    const $ = (id) => document.getElementById(id);

    function showStatus(el, text, type = 'ok') {
      el.textContent = text;
      el.className = `status show ${type}`;
    }

    function setBadge(text) {
      $('autoRunState').textContent = text;
    }

    function escapeHtml(v) {
      return String(v ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function nl2br(v) {
      return escapeHtml(v).replace(/\n/g, '<br>');
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, {
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
        ...options,
      });

      const text = await res.text();
      let data;
      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { ok: false, error: text || `HTTP ${res.status}` };
      }

      if (!res.ok || data.ok === false) {
        throw new Error(data.error || data.message || `HTTP ${res.status}`);
      }

      return data;
    }

    function renderConsultation() {
      const root = $('consultationInfo');
      const item = state.consultation;

      if (!item) {
        root.className = 'muted';
        root.textContent = '상담 정보를 찾지 못했습니다.';
        return;
      }

      root.className = '';
      root.innerHTML = `
        <div class="meta-box"><strong>ID</strong><div>${escapeHtml(item.id || '-')}</div></div>
        <div class="meta-box"><strong>성함</strong><div>${escapeHtml(item.name || item.nickname || '-')}</div></div>
        <div class="meta-box"><strong>연락처</strong><div>${escapeHtml(item.contact || item.contactChannel || '-')}</div></div>
        <div class="meta-box"><strong>메뉴</strong><div>${escapeHtml(item.menuTitle || item.menu || '-')}</div></div>
        <div class="meta-box"><strong>질문</strong><div>${nl2br(item.question || '-')}</div></div>
        <div class="meta-box"><strong>메모</strong><div>${nl2br(item.memo || '-')}</div></div>
      `;

      $('recommendationText').value = item.recommendation || '';
      $('drawResultText').value = item.drawResult || item.draw_result || '';
      $('finalReadingText').value = item.finalReading || item.final_reading || '';
      $('kakaoText').value = item.kakaoText || item.kakao_text || '';
    }

    async function loadConsultation() {
      if (!state.consultationId) {
        showStatus($('infoStatus'), 'URL에 상담 ID가 없습니다. admin2에서 "자동 실행" 버튼으로 들어와 주세요.', 'error');
        setBadge('상담 ID 없음');
        return;
      }

      try {
        setBadge('상담 불러오는 중');
        const data = await fetchJson(`/api/admin/consultations/${encodeURIComponent(state.consultationId)}`);
        state.consultation = data.consultation || data.item || null;
        renderConsultation();
        setBadge('상담 로딩 완료');
        showStatus($('infoStatus'), '상담 정보를 불러왔습니다.', 'ok');
      } catch (e) {
        setBadge('로드 실패');
        showStatus($('infoStatus'), e.message || '상담 정보 로드 실패', 'error');
      }
    }

    async function generateRecommendation() {
      if (!state.consultationId) {
        return showStatus($('recommendationStatus'), '상담 ID가 없습니다.', 'error');
      }

      try {
        showStatus($('recommendationStatus'), '추천 생성 중...', 'warn');
        const data = await fetchJson(`/api/admin/consultations/${encodeURIComponent(state.consultationId)}/recommendation/generate`, {
          method: 'POST',
        });
        $('recommendationText').value = data.recommendation || '';
        showStatus($('recommendationStatus'), '추천 생성 완료', 'ok');
      } catch (e) {
        showStatus($('recommendationStatus'), e.message || '추천 생성 실패', 'error');
        throw e;
      }
    }

    async function saveRecommendation() {
      if (!state.consultationId) {
        return showStatus($('recommendationStatus'), '상담 ID가 없습니다.', 'error');
      }

      try {
        await fetchJson(`/api/admin/consultations/${encodeURIComponent(state.consultationId)}/recommendation`, {
          method: 'POST',
          body: JSON.stringify({ recommendation: $('recommendationText').value }),
        });
        showStatus($('recommendationStatus'), '추천 저장 완료', 'ok');
      } catch (e) {
        showStatus($('recommendationStatus'), e.message || '추천 저장 실패', 'error');
      }
    }

    async function autoDraw() {
      if (!state.consultationId) {
        return showStatus($('drawStatus'), '상담 ID가 없습니다.', 'error');
      }

      try {
        showStatus($('drawStatus'), '자동 드로우 실행 중...', 'warn');
        const data = await fetchJson(`/api/admin/consultations/${encodeURIComponent(state.consultationId)}/draw/generate`, {
          method: 'POST',
          body: JSON.stringify({
            recommendation: $('recommendationText').value
          }),
        });
        $('drawResultText').value = data.drawResult || data.result || '';
        showStatus($('drawStatus'), '자동 드로우 완료', 'ok');
      } catch (e) {
        showStatus($('drawStatus'), e.message || '자동 드로우 실패', 'error');
        throw e;
      }
    }

    async function saveDraw() {
      if (!state.consultationId) {
        return showStatus($('drawStatus'), '상담 ID가 없습니다.', 'error');
      }

      try {
        await fetchJson(`/api/admin/consultations/${encodeURIComponent(state.consultationId)}/draw`, {
          method: 'POST',
          body: JSON.stringify({ drawResult: $('drawResultText').value }),
        });
        showStatus($('drawStatus'), '드로우 저장 완료', 'ok');
      } catch (e) {
        showStatus($('drawStatus'), e.message || '드로우 저장 실패', 'error');
      }
    }

    async function generateFinalReading() {
      if (!state.consultationId) {
        return showStatus($('readingStatus'), '상담 ID가 없습니다.', 'error');
      }

      try {
        showStatus($('readingStatus'), '최종 리딩 생성 중...', 'warn');
        const data = await fetchJson(`/api/admin/consultations/${encodeURIComponent(state.consultationId)}/reading/generate`, {
          method: 'POST',
          body: JSON.stringify({
            recommendation: $('recommendationText').value,
            drawResult: $('drawResultText').value,
          }),
        });
        $('finalReadingText').value = data.reading || data.finalReading || '';
        showStatus($('readingStatus'), '최종 리딩 생성 완료', 'ok');
      } catch (e) {
        showStatus($('readingStatus'), e.message || '최종 리딩 생성 실패', 'error');
      }
    }

    async function saveFinalReading() {
      if (!state.consultationId) {
        return showStatus($('readingStatus'), '상담 ID가 없습니다.', 'error');
      }

      try {
        await fetchJson(`/api/admin/consultations/${encodeURIComponent(state.consultationId)}/reading`, {
          method: 'POST',
          body: JSON.stringify({ finalReading: $('finalReadingText').value }),
        });
        showStatus($('readingStatus'), '최종 리딩 저장 완료', 'ok');
      } catch (e) {
        showStatus($('readingStatus'), e.message || '최종 리딩 저장 실패', 'error');
      }
    }

    function generateKakao() {
      const item = state.consultation || {};
      const reading = $('finalReadingText').value.trim();

      if (!reading) {
        return showStatus($('kakaoStatus'), '최종 리딩이 비어 있습니다.', 'error');
      }

      $('kakaoText').value = [
        `${item.name || item.nickname || '내담자님'} 안녕하세요.`,
        '',
        '요청주신 리딩 결과 전달드려요.',
        '',
        reading,
        '',
        '추가 질문이 있으시면 이어서 남겨주세요.',
      ].join('\n');

      showStatus($('kakaoStatus'), '카톡 문구 생성 완료', 'ok');
    }

    async function copyKakao() {
      const text = $('kakaoText').value.trim();
      if (!text) {
        return showStatus($('kakaoStatus'), '복사할 문구가 없습니다.', 'error');
      }

      try {
        await navigator.clipboard.writeText(text);
        showStatus($('kakaoStatus'), '복사 완료', 'ok');
      } catch (e) {
        showStatus($('kakaoStatus'), e.message || '복사 실패', 'error');
      }
    }

    async function autorun() {
      try {
        setBadge('자동 실행 중');
        await generateRecommendation();
        await saveRecommendation();
        await autoDraw();
        await saveDraw();
        setBadge('자동 실행 완료');
      } catch {
        setBadge('자동 실행 실패');
      }
    }

    $('loadBtn').addEventListener('click', loadConsultation);
    $('generateRecommendationBtn').addEventListener('click', generateRecommendation);
    $('saveRecommendationBtn').addEventListener('click', saveRecommendation);
    $('autoDrawBtn').addEventListener('click', autoDraw);
    $('saveDrawBtn').addEventListener('click', saveDraw);
    $('generateFinalReadingBtn').addEventListener('click', generateFinalReading);
    $('saveFinalReadingBtn').addEventListener('click', saveFinalReading);
    $('generateKakaoBtn').addEventListener('click', generateKakao);
    $('copyKakaoBtn').addEventListener('click', copyKakao);

    (async () => {
      await loadConsultation();
      if (shouldAutorun && state.consultationId) {
        await autorun();
      }
    })();
  </script>
</body>
</html>
