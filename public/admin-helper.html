
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>레지나 리딩 보조앱</title>

<style>
body { background:#0b1020; color:#fff; font-family:sans-serif; margin:0; }
.app { padding:20px; max-width:900px; margin:auto; }
.btn { padding:10px 14px; border-radius:10px; background:#1a2440; color:#fff; border:none; cursor:pointer; }
.btn.primary { background:#8b5cf6; }
textarea { width:100%; min-height:140px; background:#111827; color:#fff; border:1px solid #333; border-radius:10px; padding:10px; }
.panel { border:1px solid #333; padding:16px; border-radius:12px; margin-top:16px; }
</style>
</head>

<body>
<div class="app">

<h1>레지나 리딩 보조앱</h1>

<div class="panel">
  <button id="runBtn" class="btn primary">자동 실행</button>
</div>

<div class="panel">
  <h3>추천</h3>
  <textarea id="recommendationText"></textarea>
</div>

<div class="panel">
  <h3>드로우 결과</h3>
  <textarea id="drawResultText"></textarea>
</div>

<div class="panel">
  <h3>최종 리딩</h3>
  <textarea id="finalReadingText"></textarea>
</div>

</div>

<script>
const qs = new URLSearchParams(location.search);
const consultationId = qs.get('id');
const shouldAutorun = qs.get('autorun') === '1';

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// 상담 불러오기
async function loadConsultation() {
  if (!consultationId) return;

  const res = await fetch(`/api/admin/consultations/${consultationId}`, {
    credentials: 'include'
  });
  const data = await res.json();

  const item = data.consultation || data.item || {};

  document.getElementById('recommendationText').value = item.recommendation || '';
  document.getElementById('drawResultText').value = item.drawResult || item.draw_result || '';
  document.getElementById('finalReadingText').value = item.finalReading || item.final_reading || '';
}

// 추천 생성
async function generateRecommendation() {
  const res = await fetch(`/api/admin/consultations/${consultationId}/recommendation/generate`, {
    method:'POST',
    credentials: 'include'
  });
  const data = await res.json();
  document.getElementById('recommendationText').value = data.recommendation || '';
}

// 자동 드로우
async function drawCards() {
  const rec = document.getElementById('recommendationText').value || '';

  let deckName = "유니버셜 타로";

  const deckMatch =
    rec.match(/메인\s*덱\s*[:：]?\s*([^\n]+)/i) ||
    rec.match(/추천\s*덱\s*[:：]?\s*([^\n]+)/i) ||
    rec.match(/덱\s*[:：]?\s*([^\n]+)/i);

  if (deckMatch) deckName = deckMatch[1].trim();

  const cards = ["The Fool","The Magician","The Lovers","The Star","The Moon","The Sun"];

  const countMatch =
    rec.match(/장수\s*[:：]?\s*(\d+)/i) ||
    rec.match(/(\d+)\s*장/i);

  const count = countMatch
    ? Math.min(13, Math.max(1, parseInt(countMatch[1], 10)))
    : 3;

  let result = `**덱**: ${deckName}\n**장수**: ${count}\n\n**포지션별 드로우**\n`;

  for (let i = 0; i < count; i++) {
    result += `- 카드 ${i + 1}: ${cards[Math.floor(Math.random() * cards.length)]}\n`;
  }

  let extra = [];

  // 🔥 오라클 덱 목록
  const ORACLE_DECKS = [
    "스타시드 오라클",
    "힐링 워터 오라클",
    "세이크리드 크리에이터즈 오라클",
    "보이스 오브 더 소울스 오라클",
    "샤먼 위즈덤 오라클",
    "더 엔젤 가이드 오라클",
    "BUDDHA WISDOM SHAKTI POWER Oracle",
    "엔젤릭 라이트워크 힐링 오라클",
    "러브 플라워 오라클",
    "하트 로맨틱 오라클",
    "네이키드 트루",
    "오션 오브 위즈덤 오라클",
    "로맨스 엔젤 오라클",
    "자두의 해결카드",
"자두의 대답카드"
  ];

  // 🔥 오라클 (덱 이름까지 반영)
  if (/오라클/i.test(rec)) {
    let matchedDeck = ORACLE_DECKS.find(d =>
  rec.includes(d) || d.includes(rec) || rec.replace(/\s/g,'').includes(d.replace(/\s/g,''))
);
    if (!matchedDeck) {
      matchedDeck = ORACLE_DECKS[Math.floor(Math.random() * ORACLE_DECKS.length)];
    }

 const ORACLE_FILES = {
  "스타시드 오라클": "/data/starseed.json",
  "힐링 워터 오라클": "/data/healing_water.json",
  "세이크리드 크리에이터즈 오라클": "/data/sacred_creators.json",
  "보이스 오브 더 소울스 오라클": "/data/voice_souls.json",
  "샤먼 위즈덤 오라클": "/data/shaman_wisdom_oracle_simple.json",
  "더 엔젤 가이드 오라클": "/data/angel_guide.json",
  "엔젤 가이드 오라클": "/data/angel_guide.json",
  "BUDDHA WISDOM SHAKTI POWER Oracle": "/data/buddha_wisdom_shakti_power_oracle_simple.json",
  "엔젤릭 라이트워크 힐링 오라클": "/data/angelic_lightwork.json",
  "러브 플라워 오라클": "/data/love_flower.json",
  "하트 로맨틱 오라클": "/data/heart_romantic_oracle_simple.json",
  "네이키드 트루": "/data/naked_truth_oracle_simple.json",
  "오션 오브 위즈덤 오라클": "/data/ocean_of_the_wisdom_oracle_simple.json",
  "로맨스 엔젤 오라클": "/data/romance_angels_oracle.json",
  "자두의 해결카드": "/data/jadu_answer_oracle.json",
  "자두의 대답카드": "/data/jadu_answer_oracle.json"
};

let msg = "메시지 없음";

if (ORACLE_FILES[matchedDeck]) {
  try {
    const res = await fetch(ORACLE_FILES[matchedDeck]);
    const data = await res.json();

    const card = data[Math.floor(Math.random() * data.length)];
    msg = card.name || card;
    extra.push(`**오라클**: ${matchedDeck} - ${msg}`);
  } catch(e) {
    msg = "로딩 실패";
  }
}

}

  // 🔥 레노먼드
  if (/레노먼드/i.test(rec)) {
    const leno = ["1 라이더","2 클로버","3 배","4 집"];
    extra.push(`**레노먼드**: ${leno[Math.floor(Math.random()*leno.length)]}`);
  }

  // 🔥 룬
  if (/룬/i.test(rec)) {
    const rune = ["Fehu","Uruz","Jera","Ehwaz"];
    extra.push(`**룬**: ${rune[Math.floor(Math.random()*rune.length)]}`);
  }

  // 🔥 주역 / 아이칭 / 육효
  if (/아이칭|주역|육효/i.test(rec)) {
    const iching = ["건(乾)", "곤(坤)", "수뢰둔", "화수미제", "천풍구"];
    extra.push(`**주역**: ${iching[Math.floor(Math.random()*iching.length)]}`);
  }

  // 🔥 오간기
  if (/오간기/i.test(rec)) {
    const ogangi = ["목(木)","화(火)","토(土)","금(金)","수(水)"];
    extra.push(`오간기: ${ogangi[Math.floor(Math.random()*ogangi.length)]}`);
  }

  // 🔥 오방기
  if (/오방기/i.test(rec)) {
    const obang = ["동","서","남","북","중앙"];
    extra.push(`오방기: ${obang[Math.floor(Math.random()*obang.length)]}`);
  }

  if (extra.length > 0) {
    result += "\n" + extra.join("\n");
  }

  document.getElementById('drawResultText').value = result;
  return result;
}

// 저장
async function saveDraw(draw) {
  await fetch(`/api/admin/consultations/${consultationId}/draw`, {
    method:'POST',
    credentials: 'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ drawResult: draw })
  });
}

// 리딩 생성
async function generateReading() {
  const res = await fetch(`/api/admin/consultations/${consultationId}/reading/generate`, {
    method:'POST',
    credentials: 'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      recommendation: document.getElementById('recommendationText').value,
      drawResult: document.getElementById('drawResultText').value
    })
  });

  const data = await res.json();
  document.getElementById('finalReadingText').value = data.reading || data.finalReading || '';
}

// 전체 자동 흐름
async function autorun() {
  await generateRecommendation();
  await sleep(400);

  const draw = await drawCards();
  await saveDraw(draw);

  await generateReading();
}

// 버튼
document.getElementById('runBtn').addEventListener('click', autorun);

// 초기
window.addEventListener('load', async ()=>{
  await loadConsultation();

  if (shouldAutorun && consultationId) {
    setTimeout(autorun, 400);
  }
});
</script>

</body>
</html>
