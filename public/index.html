<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레지나타로썰 상담 접수</title>
    <style>
      :root { --bg:#090c18; --panel:#11182a; --line:#2e3854; --text:#ece5d8; --muted:#bcb29f; --gold:#cba871; --indigo:#5e58b7; }
      *{box-sizing:border-box} body{margin:0;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at top,#171f39 0%,var(--bg) 58%);color:var(--text)}
      .wrap{max-width:980px;margin:0 auto;padding:24px 16px 56px}
      .hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
      .hero{padding:24px;margin:12px 0 16px}
      h1{margin:0;font-size:30px}.desc{margin-top:8px;color:var(--muted);line-height:1.6}
      .badge{display:inline-block;margin-top:10px;padding:6px 12px;border:1px solid #495376;border-radius:999px;background:#212a44;font-size:12px}
      .card{padding:16px;margin-bottom:12px}
      .step-title{font-weight:700;margin-bottom:8px;color:#f0dec0}
      .hint{font-size:12px;color:var(--muted)}
      .option-grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
      .option,.menu-card{cursor:pointer;transition:.2s;border:1px solid #3a4569;background:#141c32;border-radius:12px;padding:12px}
      .option.active,.menu-card.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(203,168,113,.45)}
      .menu-grid{display:grid;gap:10px;grid-template-columns:repeat(3,1fr)}
      .menu-title{font-weight:700;margin-bottom:4px}.meta{font-size:13px;color:var(--muted);line-height:1.5}
      label{font-size:13px;color:#ded5c3;display:block;margin-bottom:6px}
      input,textarea,button{width:100%;border-radius:10px;border:1px solid #3b4566;background:#171f36;color:var(--text);padding:11px;font-size:14px}
      textarea{min-height:120px;resize:vertical}
      .submit{margin-top:12px;background:linear-gradient(180deg,#c9a570,#9e7c49);border:0;color:#261d0c;font-weight:700}
      .msg{font-size:13px;margin-top:10px}.ok{color:#86efac}.err{color:#fecaca}
      .fade{animation:fadeIn .25s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
      .pay-box{margin-top:12px;padding:12px;border:1px solid #6e5732;background:#2a2115;border-radius:12px;color:#f5ddb3}
      @media(max-width:900px){.menu-grid,.option-grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const { useEffect, useMemo, useState } = React;
      const MENU_CONFIG_URL = '/data/consultation-products.json';
      const fallbackMenus = [
        { id: 'auto-basic', title: '자동 리딩', rec: '빠른 결과 확인', price: 3000, desc: '입금 확인 후 자동으로 결과가 전달됩니다.' },
        { id: 'chat-love', title: '연애 리딩', rec: '관계 흐름/재회/감정 확인', price: 39000, desc: '현재 관계 흐름과 핵심 변수를 채팅 상담으로 정리합니다.' },
        { id: 'chat-career', title: '진로·재물 리딩', rec: '이직/사업/금전 선택', price: 49000, desc: '선택지별 흐름과 주의 포인트를 채팅 기반으로 안내합니다.' },
      ];

      function asNumberPrice(value) {
        const num = Number(value);
        return Number.isFinite(num) ? num : 0;
      }
      function formatPrice(price) {
        return `${price.toLocaleString('ko-KR')}원`;
      }

      function App() {
        const [serviceType, setServiceType] = useState('');
        const [menus, setMenus] = useState(fallbackMenus);
        const [selected, setSelected] = useState('');
        const [form, setForm] = useState({ name: '', contactChannel: '', question: '', memo: '' });
        const [status, setStatus] = useState({ type: '', text: '' });
        const [submitting, setSubmitting] = useState(false);
        const [submittedInfo, setSubmittedInfo] = useState(null);

        const selectedMenu = useMemo(
          () => menus.find((menu) => menu.id === selected) || null,
          [menus, selected]
        );
        const selectedPrice = asNumberPrice(selectedMenu?.price);
        const selectedProductType = selectedPrice === 3000 ? 'auto' : 'reserve';

        const canShowContact = Boolean(serviceType);
        const canShowMenu = canShowContact && form.name.trim() && form.contactChannel.trim();
        const canShowQuestion = canShowMenu && selectedMenu;
        const canShowMemoAndSubmit = canShowQuestion && form.question.trim();

        useEffect(() => {
          async function loadMenus() {
            try {
              const res = await fetch(MENU_CONFIG_URL);
              const data = await res.json();
              if (Array.isArray(data.products) && data.products.length > 0) {
                setMenus(data.products);
              }
            } catch (_) {
              // fallback 유지
            }
          }
          loadMenus();
        }, []);

        async function onSubmit(e) {
          e.preventDefault();
          if (!serviceType || !selectedMenu) return;

          setSubmitting(true);
          setStatus({ type: '', text: '' });
          try {
            const res = await fetch('/api/consultations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                serviceType,
                menuId: selectedMenu.id,
                menuTitle: selectedMenu.title,
                price: selectedPrice,
                name: form.name,
                contactChannel: form.contactChannel,
                question: form.question,
                memo: form.memo,
              }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '접수 실패');

            setStatus({ type: 'ok', text: `${data.message} (접수번호: ${data.consultation.id})` });
            setSubmittedInfo({ id: data.consultation.id, productType: selectedProductType, price: selectedPrice });
          } catch (error) {
            setStatus({ type: 'err', text: error.message });
          } finally {
            setSubmitting(false);
          }
        }

        return React.createElement('div', { className:'wrap' },
          React.createElement('section', { className:'hero' },
            React.createElement('h1', null, '레지나타로썰 상담 접수'),
            React.createElement('p', { className:'desc' }, '아래 단계를 순서대로 진행하면 상담 접수가 완료됩니다.'),
            React.createElement('span', { className:'badge' }, '공식 접수 채널 · 채팅 상담 진행')
          ),

          React.createElement('form', { onSubmit },
            React.createElement('section', { className:'card fade' },
              React.createElement('div', { className:'step-title' }, '1) 서비스 선택'),
              React.createElement('div', { className:'option-grid' },
                React.createElement('div', { className:`option ${serviceType === 'consultation' ? 'active' : ''}`, onClick:() => setServiceType('consultation') },
                  React.createElement('div', { className:'menu-title' }, '상담 접수'),
                  React.createElement('div', { className:'meta' }, '신규 상담 접수 흐름')
                ),
                React.createElement('div', { className:`option ${serviceType === 'followup' ? 'active' : ''}`, onClick:() => setServiceType('followup') },
                  React.createElement('div', { className:'menu-title' }, '후속 상담'),
                  React.createElement('div', { className:'meta' }, '기존 상담 연장/후속 흐름')
                )
              )
            ),

            canShowContact ? React.createElement('section', { className:'card fade' },
              React.createElement('div', { className:'step-title' }, '2) 이름/연락처'),
              React.createElement('label', null, '이름/닉네임'),
              React.createElement('input', { value:form.name, onChange:(e)=>setForm({...form,name:e.target.value}), placeholder:'상담 시 불릴 이름을 입력하세요.' }),
              React.createElement('label', { style:{marginTop:'10px'} }, '카카오톡 ID 또는 연락 가능한 전화번호'),
              React.createElement('input', { value:form.contactChannel, onChange:(e)=>setForm({...form,contactChannel:e.target.value}), placeholder:'예) 카카오톡 ID / 010-0000-0000' })
            ) : null,

            canShowMenu ? React.createElement('section', { className:'card fade' },
              React.createElement('div', { className:'step-title' }, '3) 상담 메뉴 선택'),
              React.createElement('div', { className:'menu-grid' }, ...menus.map((m) => React.createElement('article', {
                key:m.id,
                className:`menu-card ${selected===m.id?'active':''}`,
                onClick:() => setSelected(m.id)
              },
                React.createElement('div', { className:'menu-title' }, m.title),
                React.createElement('div', { className:'meta' }, m.desc),
                React.createElement('div', { className:'meta' }, `안내: ${formatPrice(asNumberPrice(m.price))}`)
              )))
            ) : null,

            canShowQuestion ? React.createElement('section', { className:'card fade' },
              React.createElement('div', { className:'step-title' }, '4) 질문 내용'),
              selectedProductType === 'auto'
                ? React.createElement('div', { className:'hint' }, '입금 확인 후 자동으로 결과가 전달됩니다.')
                : React.createElement('div', { className:'hint' }, '예약 가능 시간은 평일 20:00/21:00/22:00, 주말 10:00~22:00입니다.'),
              React.createElement('label', { style:{marginTop:'8px'} }, '핵심 질문'),
              React.createElement('textarea', { value:form.question, onChange:(e)=>setForm({...form,question:e.target.value}), placeholder:'상황과 핵심 질문을 적어주세요.' })
            ) : null,

            canShowMemoAndSubmit ? React.createElement('section', { className:'card fade' },
              React.createElement('div', { className:'step-title' }, '5) 추가 메모 & 접수'),
              React.createElement('label', null, '추가 메모 (선택)'),
              React.createElement('textarea', { value:form.memo, onChange:(e)=>setForm({...form,memo:e.target.value}), placeholder:'상담 전 전달할 메모가 있다면 적어주세요.' }),
              React.createElement('button', { className:'submit', type:'submit', disabled: submitting }, submitting ? '접수 중...' : '상담 접수 제출'),
              status.text ? React.createElement('div', { className: `msg ${status.type === 'ok' ? 'ok' : 'err'}` }, status.text) : null,
              submittedInfo && submittedInfo.price > 0 ? React.createElement('div', { className:'pay-box' },
                React.createElement('div', null, `입금 안내: ${formatPrice(submittedInfo.price)}`),
                React.createElement('div', { className:'hint' }, submittedInfo.productType === 'auto'
                  ? '입금 확인 후 자동 리딩이 진행됩니다.'
                  : '입금 확인 후 예약 가능한 시간 안내를 도와드립니다.')
              ) : null
            ) : null
          )
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
