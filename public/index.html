<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레지나타로썰 상담 접수</title>
    <style>
      body{margin:0;background:radial-gradient(circle at top,#1b2645 0%,#0b1020 60%);color:#e2e8f0;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif}
      .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }
      .hero { margin-bottom: 20px; }
      .desc { color: #cbd5e1; line-height: 1.6; }
      .card { background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; border-radius: 18px; padding: 20px; margin-bottom: 16px; }
      .step-title { font-weight: 700; margin-bottom: 14px; color: #f8d184; }
      .option-grid, .menu-grid { display: grid; gap: 12px; }
      .option, .menu-card { border: 1px solid #334155; border-radius: 14px; background: #0f172a; color: #e2e8f0; padding: 14px 16px; cursor: pointer; }
      .option.active, .menu-card.active { border-color: #d4a95f; box-shadow: 0 0 0 1px #d4a95f inset; }
      .menu-title { font-weight: 700; margin-bottom: 6px; }
      .menu-price { color: #f8d184; margin-bottom: 6px; }
      .menu-desc { color: #94a3b8; font-size: 14px; }
      input, textarea { width: 100%; margin-top: 8px; padding: 14px 16px; border-radius: 14px; border: 1px solid #334155; background: #17203a; color: #e2e8f0; box-sizing: border-box; }
      textarea{resize:vertical}
      .submit-btn { width: 100%; margin-top: 14px; padding: 16px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #d4a95f, #c89749); color: #1e1b16; font-weight: 700; cursor: pointer; }
      .fade { animation: fadeUp 0.28s ease; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .status-text, .payment-desc, .selected-summary { margin-top: 12px; color: #cbd5e1; }
      .account { font-size: 18px; font-weight: 700; color: #f8d184; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
      const { useEffect, useState } = React;

      const API_BASE = 'https://regina-tarot-app.onrender.com';

      const fallbackMenus = [
        { id: 'line-direction', title: '한 줄 방향 리딩', price: 3000, desc: '입금 확인 후 자동 전달' },
        { id: 'core-summary', title: '핵심 정리 리딩', price: 7000, desc: '핵심 요약' },
        { id: 'decision-flow', title: '결정 흐름 리딩', price: 18000, desc: '결정 흐름 분석' },
        { id: 'deep-decision', title: '심층 결정 리딩', price: 30000, desc: '심층 리딩' },
      ];

      function App(){
        const [serviceType, setServiceType] = useState('');
        const [form, setForm] = useState({ name:'', contact:'', question:'', memo:'' });
        const [selectedMenu, setSelectedMenu] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [statusText, setStatusText] = useState('');

        async function onSubmit(e){
          e.preventDefault();

          try {
            const res = await fetch(`${API_BASE}/api/consultations`, {
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({
                serviceType,
                menuId: selectedMenu?.id,
                menuTitle: selectedMenu?.title,
                price: Number(selectedMenu?.price),
                name: form.name,
                contactChannel: form.contact,
                question: form.question,
                memo: form.memo,
              })
            });

            const data = await res.json();

            if(!data.ok) throw new Error(data.error);

            setSubmitted(true);
            setStatusText(`접수 완료 (번호: ${data.consultation.id})`);

          } catch (err) {
            setStatusText(err.message);
          }
        }

        return React.createElement('div',{className:'wrap'},
          React.createElement('h1',null,'레지나타로썰 상담 접수'),

          React.createElement('form',{onSubmit},

            React.createElement('input',{
              placeholder:'이름',
              value:form.name,
              onChange:e=>setForm({...form,name:e.target.value})
            }),

            React.createElement('input',{
              placeholder:'연락처',
              value:form.contact,
              onChange:e=>setForm({...form,contact:e.target.value})
            }),

            React.createElement('textarea',{
              placeholder:'질문',
              value:form.question,
              onChange:e=>setForm({...form,question:e.target.value})
            }),

            React.createElement('button',{className:'submit-btn'},'상담 접수'),

            statusText && React.createElement('div',null,statusText)
          )
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
