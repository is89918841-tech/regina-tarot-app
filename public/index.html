<!doctype html>
<!-- public consultation entry -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>레지나타로썰 상담 접수</title>
    <style>
      :root { --bg:#090c18; --panel:#11182a; --line:#2e3854; --text:#ece5d8; --muted:#bcb29f; --gold:#cba871; --indigo:#5e58b7; }
      *{box-sizing:border-box} body{margin:0;font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;background:radial-gradient(circle at top,#171f39 0%,var(--bg) 58%);color:var(--text)}
      .wrap{max-width:980px;margin:0 auto;padding:24px 16px 56px}.nav a{color:var(--muted);margin-right:10px;text-decoration:none;font-size:13px}
      .hero,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}.hero{padding:24px;margin:12px 0 16px}
      h1{margin:0;font-size:30px}.desc{margin-top:8px;color:var(--muted);line-height:1.6}.badge{display:inline-block;margin-top:10px;padding:6px 12px;border:1px solid #495376;border-radius:999px;background:#212a44;font-size:12px}
      .grid{display:grid;gap:14px;grid-template-columns:repeat(3,1fr)} .card{padding:16px}
      .menu-card{cursor:pointer;transition:.2s}.menu-card:hover{border-color:#5b6591}.menu-card.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(203,168,113,.45)}
      .menu-title{font-weight:700;margin-bottom:6px}.meta{font-size:13px;color:var(--muted);line-height:1.5}
      .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.step{border:1px solid #3a4569;border-radius:12px;padding:10px;background:#141c32;font-size:13px}
      .selected{margin:8px 0 14px;padding:12px;border:1px solid #3a4569;border-radius:12px;background:#141c32}
      label{font-size:13px;color:#ded5c3;display:block;margin-bottom:6px}input,textarea,button{width:100%;border-radius:10px;border:1px solid #3b4566;background:#171f36;color:var(--text);padding:11px;font-size:14px}
      textarea{min-height:140px;resize:vertical}.hint{font-size:12px;color:var(--muted);margin-top:6px}.agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#d8cebc;margin-top:8px}
      .agree input{width:auto;margin-top:2px}.submit{margin-top:12px;background:linear-gradient(180deg,#c9a570,#9e7c49);border:0;color:#261d0c;font-weight:700}
      .msg{font-size:13px;margin-top:10px}.ok{color:#86efac}.err{color:#fecaca}
      @media(max-width:900px){.grid{grid-template-columns:1fr}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const { useEffect, useMemo, useState } = React;
      const MENU_CONFIG_URL = '/data/consultation-products.json';
      const fallbackMenus = [
        { id: 'chat-love', title: '연애 리딩', rec: '관계 흐름/재회/감정 확인', price: '39,000원', desc: '현재 관계 흐름과 핵심 변수를 채팅 상담으로 정리합니다.' },
        { id: 'chat-career', title: '진로·재물 리딩', rec: '이직/사업/금전 선택', price: '49,000원', desc: '선택지별 흐름과 주의 포인트를 채팅 기반으로 안내합니다.' },
        { id: 'chat-deep', title: '심층 종합 리딩', rec: '복합 이슈·장기 흐름 점검', price: '69,000원', desc: '핵심 질문 중심으로 확장 리딩을 진행하는 채팅 상담입니다.' },
      ];

      function App() {
        const [menus, setMenus] = useState(fallbackMenus);
        const [selected, setSelected] = useState(fallbackMenus[0].id);
        const [form, setForm] = useState({ name: '', contactChannel: '', question: '', agree: false });
        const [status, setStatus] = useState({ type: '', text: '' });
        const [submitting, setSubmitting] = useState(false);

        const selectedMenu = useMemo(
          () => menus.find((menu) => menu.id === selected) || menus[0],
          [menus, selected]
        );

        useEffect(() => {
          async function loadMenus() {
            try {
              const res = await fetch(MENU_CONFIG_URL);
              const data = await res.json();
              if (Array.isArray(data.products) && data.products.length > 0) {
                setMenus(data.products);
                setSelected(data.products[0].id);
              }
            } catch (_) {
              // 설정 로드 실패 시 fallbackMenus 유지
            }
          }
          loadMenus();
        }, []);

        async function onSubmit(e) {
          e.preventDefault();
          if (!form.agree) {
            setStatus({ type: 'err', text: '동의 후 접수 가능합니다.' });
            return;
          }
          if (!selectedMenu) {
            setStatus({ type: 'err', text: '상담 메뉴를 선택해주세요.' });
            return;
          }

          setSubmitting(true);
          setStatus({ type: '', text: '' });
          try {
            const res = await fetch('/api/consultations', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                menuId: selectedMenu.id,
                menuTitle: selectedMenu.title,
                name: form.name,
                contactChannel: form.contactChannel,
                question: form.question,
              }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '접수 실패');

            setStatus({ type: 'ok', text: `${data.message} (접수번호: ${data.consultation.id})` });
            setForm({ name: '', contactChannel: '', question: '', agree: false });
          } catch (error) {
            setStatus({ type: 'err', text: error.message });
          } finally {
            setSubmitting(false);
          }
        }

        return React.createElement('div', { className:'wrap' },
          React.createElement('div', { className:'nav' },
            React.createElement('a', { href:'/' }, '상담 접수 홈')
          ),
          React.createElement('section', { className:'hero' },
            React.createElement('h1', null, '레지나타로썰 상담 접수'),
            React.createElement('p', { className:'desc' }, '현재 상담은 채팅 상담 기준으로 진행됩니다. 아래에서 상담 메뉴를 선택하고 핵심 질문을 남겨주세요.'),
            React.createElement('span', { className:'badge' }, '공식 접수 채널 · 채팅 상담 진행')
          ),
          React.createElement('section', { className:'card' },
            React.createElement('h3', null, '상담 메뉴 선택'),
            React.createElement('p', { className:'meta' }, '메뉴를 선택하면 아래 접수 폼에 자동으로 반영됩니다.'),
            React.createElement('section', { className:'grid' }, ...menus.map((m) => React.createElement('article', { key:m.id, className:`card menu-card ${selected===m.id?'active':''}`, onClick:() => setSelected(m.id) },
              React.createElement('div', { className:'menu-title' }, m.title),
              React.createElement('div', { className:'meta' }, m.desc),
              React.createElement('div', { className:'meta' }, `추천 대상: ${m.rec}`),
              React.createElement('div', { className:'meta' }, `안내: ${m.price}`)
            )))
          ),
          selectedMenu ? React.createElement('section', { className:'selected' },
            React.createElement('div', { className:'menu-title' }, `선택된 메뉴: ${selectedMenu.title}`),
            React.createElement('div', { className:'meta' }, `${selectedMenu.desc} / ${selectedMenu.price}`)
          ) : null,
          React.createElement('section', { className:'steps' },
            React.createElement('div', { className:'step' }, '1) 상담 메뉴 선택'),
            React.createElement('div', { className:'step' }, '2) 채팅 상담 질문 접수'),
            React.createElement('div', { className:'step' }, '3) 확인 순서대로 채팅 안내')
          ),
          React.createElement('form', { className:'card', onSubmit },
            React.createElement('label', null, '이름/닉네임'),
            React.createElement('input', { value:form.name, onChange:(e)=>setForm({...form,name:e.target.value}), placeholder:'상담 시 불릴 이름을 입력하세요.' }),
            React.createElement('label', { style:{marginTop:'10px'} }, '연락 가능한 채널 (카카오톡 ID / 오픈채팅 링크)'),
            React.createElement('input', { value:form.contactChannel, onChange:(e)=>setForm({...form,contactChannel:e.target.value}), placeholder:'예) 카카오톡 ID, 오픈채팅 링크' }),
            React.createElement('label', { style:{marginTop:'10px'} }, '핵심 질문'),
            React.createElement('textarea', { value:form.question, onChange:(e)=>setForm({...form,question:e.target.value}), placeholder:'예) 현재 관계에서 상대의 진심이 무엇인지, 3개월 안에 관계 진전 가능성이 있는지 알고 싶어요.' }),
            React.createElement('div', { className:'hint' }, '접수 데이터는 서버의 상담 접수 저장소에 기록되며, 관리자 페이지에서 접수 목록으로 확인할 수 있습니다.'),
            React.createElement('label', { className:'agree' },
              React.createElement('input', { type:'checkbox', checked:form.agree, onChange:(e)=>setForm({...form,agree:e.target.checked}) }),
              React.createElement('span', null, '상담 안내를 확인했으며, 접수 후 확인 순서에 따라 채팅으로 안내받는 데 동의합니다.')
            ),
            React.createElement('button', { className:'submit', type:'submit', disabled: submitting }, submitting ? '접수 중...' : '상담 접수 제출'),
            status.text ? React.createElement('div', { className: `msg ${status.type === 'ok' ? 'ok' : 'err'}` }, status.text) : null
          )
        )
      }
      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
