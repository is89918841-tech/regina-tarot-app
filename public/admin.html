<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regina Admin Dashboard</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #12182b;
      --line: #2a3658;
      --text: #eef2ff;
      --muted: #9aa6c7;
      --accent: #8b5cf6;
      --accent2: #6366f1;
      --ok: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #0a0f1d, #10172a);
      color: var(--text);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }

    .hidden { display: none !important; }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 460px;
      background: rgba(18, 24, 43, 0.96);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    .login-card h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .login-card p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0 0 6px;
      font-size: 28px;
      line-height: 1.2;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 16px;
      align-items: start;
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .panel {
      background: rgba(18, 24, 43, 0.95);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.22);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--line);
      background: #1a2440;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn:hover { filter: brightness(1.08); }

    .btn.primary {
      background: linear-gradient(180deg, var(--accent), var(--accent2));
      border-color: transparent;
    }

    .btn.danger {
      background: rgba(239,68,68,0.15);
      border-color: rgba(239,68,68,0.4);
    }

    .btn.ghost {
      background: transparent;
    }

    .input, .select {
      width: 100%;
      background: #0d1428;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.5;
      border: 1px solid var(--line);
      background: #10182c;
    }

    .status.ok { border-color: rgba(34,197,94,0.4); color: #bbf7d0; }
    .status.error { border-color: rgba(239,68,68,0.4); color: #fecaca; }
    .status.warn { border-color: rgba(245,158,11,0.4); color: #fde68a; }

    .list {
      display: grid;
      gap: 10px;
      max-height: calc(100vh - 240px);
      overflow: auto;
      padding-right: 4px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: rgba(25, 34, 58, 0.8);
      cursor: pointer;
    }

    .item:hover { border-color: #4f5d84; }

    .item-title {
      font-weight: 800;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .item-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--line);
      background: rgba(99,102,241,0.12);
      color: #c7d2fe;
    }

    .badge.ready {
      background: rgba(245,158,11,0.14);
      border-color: rgba(245,158,11,0.45);
      color: #fde68a;
    }

    .badge.sent {
      background: rgba(34,197,94,0.14);
      border-color: rgba(34,197,94,0.45);
      color: #bbf7d0;
    }

    .badge.wait {
      background: rgba(239,68,68,0.14);
      border-color: rgba(239,68,68,0.45);
      color: #fecaca;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 20px 0;
    }

    .file-row {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: rgba(25, 34, 58, 0.55);
      margin-top: 8px;
    }

    .file-row:first-child { margin-top: 0; }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <div class="login-card">
      <h1>레지나 관리자</h1>
      <p>접수 목록 확인, 보조앱 실행, 지식 파일 업로드를 관리하는 화면입니다.</p>

      <div class="field">
        <label for="password">관리자 비밀번호</label>
        <input id="password" class="input" type="password" placeholder="비밀번호 입력" />
      </div>

      <div class="toolbar">
        <button id="loginBtn" class="btn primary" type="button">로그인</button>
      </div>

      <div id="loginStatus" class="status hidden"></div>
    </div>
  </div>

  <div id="adminView" class="hidden">
    <div class="app">
      <div class="topbar">
        <div class="brand">
          <h1>Regina Admin Dashboard</h1>
          <p>상담 접수 확인 / 보조앱 자동 실행 / 지식 파일 관리</p>
        </div>

        <div class="toolbar">
          <a class="btn ghost" href="/admin-helper.html" target="_blank" rel="noopener noreferrer">보조앱 열기</a>
          <button id="refreshBtn" class="btn" type="button">새로고침</button>
          <button id="logoutBtn" class="btn danger" type="button">로그아웃</button>
        </div>
      </div>

      <div class="layout">
        <section class="panel">
          <div class="toolbar" style="justify-content: space-between; margin-bottom: 12px;">
            <h2>상담 접수 목록</h2>
          </div>
          <div id="consultationsList" class="list">
            <div class="empty">아직 접수 내역이 없습니다.</div>
          </div>
        </section>

        <div class="stack">
          <section class="panel">
            <h2>지식 파일 업로드</h2>

            <div class="field">
              <label for="uploadFile">파일</label>
              <input id="uploadFile" class="input" type="file" />
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="uploadDeck">덱</label>
                <input id="uploadDeck" class="input" type="text" placeholder="예: 로맨틱 타로" />
              </div>
              <div class="field">
                <label for="uploadTopic">주제</label>
                <input id="uploadTopic" class="input" type="text" placeholder="예: 연애, 해석 가이드" />
              </div>
            </div>

            <div class="grid-2">
              <div class="field">
                <label for="uploadPriority">우선순위</label>
                <select id="uploadPriority" class="select">
                  <option value="core">core</option>
                  <option value="support">support</option>
                  <option value="optional">optional</option>
                </select>
              </div>
              <div class="field">
                <label for="uploadType">파일 타입</label>
                <select id="uploadType" class="select">
                  <option value="guidebook">guidebook</option>
                  <option value="interpretation">interpretation</option>
                  <option value="tone">tone</option>
                  <option value="rule">rule</option>
                </select>
              </div>
            </div>

            <div class="toolbar">
              <button id="uploadBtn" class="btn primary" type="button">업로드</button>
              <button id="refreshFilesBtn" class="btn" type="button">파일 목록 새로고침</button>
            </div>

            <div id="uploadStatus" class="status hidden"></div>
          </section>

          <section class="panel">
            <h2>업로드된 파일</h2>
            <div id="filesList">
              <div class="empty">아직 업로드된 파일이 없습니다.</div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script>
    const state = {
      consultations: [],
      files: [],
    };

    const $ = (id) => document.getElementById(id);

    function showStatus(el, text, type = 'ok') {
      el.textContent = text;
      el.className = `status ${type}`;
      el.classList.remove('hidden');
    }

    function hideStatus(el) {
      el.classList.add('hidden');
    }

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, {
        credentials: 'include',
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {}),
        },
        ...options,
      });

      let data = null;
      const text = await res.text();

      try {
        data = text ? JSON.parse(text) : {};
      } catch {
        data = { ok: false, error: text || `HTTP ${res.status}` };
      }

      if (!res.ok || data.ok === false) {
        throw new Error(data.error || data.message || `HTTP ${res.status}`);
      }

      return data;
    }

    function escapeHtml(v) {
      return String(v ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatDate(v) {
      if (!v) return '-';
      const d = new Date(v);
      return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleString('ko-KR');
    }

    function getStatusBadge(status) {
      const s = String(status || '');
      if (s === 'sent') return '<span class="badge sent">전달 완료</span>';
      if (s === 'ready_to_send' || s === 'reading_completed') return '<span class="badge ready">전달 대기</span>';
      return `<span class="badge wait">${escapeHtml(s || '대기')}</span>`;
    }

    function renderConsultations() {
      const root = $('consultationsList');
      root.innerHTML = '';

      if (!state.consultations.length) {
        root.innerHTML = '<div class="empty">아직 접수 내역이 없습니다.</div>';
        return;
      }

      state.consultations.forEach((item) => {
        const helperUrl = `/admin-helper.html?id=${encodeURIComponent(item.id)}&autorun=1`;

        const div = document.createElement('div');
        div.className = 'item';

        div.innerHTML = `
          <div class="item-title">${escapeHtml(item.name || item.nickname || item.contact || '이름 없음')}</div>
          <div class="item-meta">
            <span class="badge">${escapeHtml(item.menuTitle || item.menu || '메뉴 미지정')}</span>
            ${getStatusBadge(item.status)}
            <span>${escapeHtml(item.contact || item.contactChannel || '-')}</span>
            <span>${formatDate(item.createdAt || item.created_at)}</span>
          </div>
          <div class="muted" style="margin-top:8px;">
            ${escapeHtml((item.question || '').slice(0, 140) || '질문 없음')}
          </div>
          <div class="toolbar" style="margin-top:10px;">
  <a href="${helperUrl}" target="_blank" rel="noopener noreferrer" class="btn primary">자동 실행</a>

  <button class="btn danger" onclick="confirmPaid('${item.id}')">
    입금 확인 후 발송
  </button>
</div>
        `;

        root.appendChild(div);
      });
    }

    function renderFiles() {
      const root = $('filesList');
      root.innerHTML = '';

      if (!state.files.length) {
        root.innerHTML = '<div class="empty">아직 업로드된 파일이 없습니다.</div>';
        return;
      }

      state.files.forEach((file) => {
        const div = document.createElement('div');
        div.className = 'file-row';
        div.innerHTML = `
          <div style="font-weight:800; margin-bottom:6px;">
            ${escapeHtml(file.originalName || file.filename || file.storedName || '이름 없음')}
          </div>
          <div class="item-meta">
            <span class="badge">${escapeHtml(file.type || '-')}</span>
            <span>${escapeHtml(file.deck || '-')}</span>
            <span>${escapeHtml(file.topic || '-')}</span>
            <span>${escapeHtml(file.priority || '-')}</span>
            <span>${escapeHtml(file.status || '-')}</span>
          </div>
        `;
        root.appendChild(div);
      });
    }

    async function loadConsultations() {
      const data = await fetchJson('/api/admin/consultations');
      state.consultations = data.consultations || data.items || [];
      renderConsultations();
    }

    async function loadFiles() {
      const data = await fetchJson('/api/admin/files');
      state.files = data.files || [];
      renderFiles();
    }

    async function ensureSession() {
      try {
        await fetchJson('/api/admin/me');
        $('loginView').classList.add('hidden');
        $('adminView').classList.remove('hidden');
        await Promise.all([loadConsultations(), loadFiles()]);
      } catch {
        $('loginView').classList.remove('hidden');
        $('adminView').classList.add('hidden');
      }
    }

    async function login() {
      const password = $('password').value.trim();

      if (!password) {
        return showStatus($('loginStatus'), '비밀번호를 입력해주세요.', 'error');
      }

      try {
        hideStatus($('loginStatus'));
        await fetchJson('/api/admin/login', {
          method: 'POST',
          body: JSON.stringify({ password }),
        });

        $('password').value = '';
        $('loginView').classList.add('hidden');
        $('adminView').classList.remove('hidden');
        await Promise.all([loadConsultations(), loadFiles()]);
      } catch (error) {
        showStatus($('loginStatus'), error.message || '로그인 실패', 'error');
      }
    }

    async function logout() {
      try {
        await fetchJson('/api/admin/logout', { method: 'POST' });
      } catch {}
      location.reload();
    }

    async function uploadFile() {
      const file = $('uploadFile').files[0];
      if (!file) {
        return showStatus($('uploadStatus'), '업로드할 파일을 선택해주세요.', 'error');
      }

      try {
        showStatus($('uploadStatus'), '업로드 중...', 'warn');

        const body = new FormData();
        body.append('file', file);
        body.append('deck', $('uploadDeck').value.trim());
        body.append('topic', $('uploadTopic').value.trim());
        body.append('priority', $('uploadPriority').value);
        body.append('type', $('uploadType').value);

        const res = await fetch('/api/admin/upload', {
          method: 'POST',
          credentials: 'include',
          body,
        });

        const text = await res.text();
        let data;
        try {
          data = text ? JSON.parse(text) : {};
        } catch {
          data = { ok: false, error: text || `HTTP ${res.status}` };
        }

        if (!res.ok || !data.ok) {
          throw new Error(data.error || '업로드 실패');
        }

        $('uploadFile').value = '';
        $('uploadDeck').value = '';
        $('uploadTopic').value = '';
        $('uploadPriority').value = 'core';
        $('uploadType').value = 'guidebook';

        showStatus($('uploadStatus'), '업로드 완료', 'ok');
        await loadFiles();
      } catch (e) {
        showStatus($('uploadStatus'), e.message || '업로드 실패', 'error');
      }
    }

    $('loginBtn').addEventListener('click', login);
    $('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });
    $('refreshBtn').addEventListener('click', async () => {
      await Promise.all([loadConsultations(), loadFiles()]);
    });
    $('refreshFilesBtn').addEventListener('click', loadFiles);
    $('uploadBtn').addEventListener('click', uploadFile);
    $('logoutBtn').addEventListener('click', logout);

    ensureSession();

    async function confirmPaid(id) {
  if (!confirm('입금 확인하고 알림톡 발송할까요?')) return;

  const res = await fetch(`/api/admin/consultations/${id}/paid`, {
    method: 'POST',
    credentials: 'include'
  });

  const data = await res.json();

  if (data.ok) {
    alert('알림톡 발송 완료');
  } else {
    alert(data.error || '발송 실패');
  }
}
    
  </script>
</body>
</html>
