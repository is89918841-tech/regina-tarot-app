<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regina Admin Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #020617; color: #e2e8f0; }
    .wrap { max-width: 1320px; margin: 0 auto; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 100%; max-width: 460px; }
    h1, h2, h3, h4, p { margin-top: 0; }
    input, select, textarea, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
    }
    textarea { min-height: 120px; resize: vertical; }
    button { cursor: pointer; }
    button.primary { background: #2563eb; border: 0; }
    button.danger { background: #b91c1c; border: 0; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .row > * { flex: 1; min-width: 140px; }
    .grid-2 { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(520px, 1.2fr); gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; border-bottom: 1px solid #334155; padding: 8px; font-size: 14px; vertical-align: top; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: rgba(59,130,246,.12); }
    tr.selected { background: rgba(59,130,246,.22); }
    .muted { color: #94a3b8; font-size: 12px; }
    .msg-error { color: #fecaca; margin-top: 8px; }
    .msg-info { color: #bfdbfe; margin-top: 8px; }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #334155; }
    .chip.payment { background: #7c3aed; }
    .chip.submitted { background: #475569; }
    .chip.paid { background: #16a34a; }
    .chip.recommended { background: #1d4ed8; }
    .chip.drawn { background: #6d28d9; }
    .chip.finalized { background: #166534; }
    .chip.sent { background: #0f766e; }
    .tool-btn {
      display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
      background: #0b3b2e; color: #d1fae5; border: 1px solid #065f46; padding: 10px 14px; border-radius: 10px;
    }
    .tool-btn:hover { background: #0f513f; }
    .status-steps { display: flex; flex-wrap: wrap; gap: 8px; }
    .step { padding: 6px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; font-size: 12px; }
    .step.active { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa inset; }
    .step.done { border-color: #22c55e; }
    .codebox {
      margin: 8px 0; background: #0b1220; border: 1px solid #334155; border-radius: 10px;
      padding: 10px; overflow: auto; font-size: 12px; white-space: pre-wrap;
    }
    @media (max-width: 1100px) {
      .grid-2 { grid-template-columns: 1fr; }
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const STATUS_ORDER = ['submitted', 'paid', 'recommended', 'drawn', 'finalized', 'sent'];
    const STATUS_LABELS = {
      submitted: '접수됨',
      paid: '결제확인',
      recommended: '추천생성',
      drawn: '자동드로우',
      finalized: '최종리딩',
      sent: '전송완료',
    };
    const INTERNAL_TOOLS = [
      { label: '리딩 보조앱 열기', url: '/admin/helper' },
      { label: '그랑따블로 열기', url: '/admin/grand-tableau' },
    ];

    const state = {
      authenticated: false,
      token: '',
      statusText: '',
      statusType: 'info',
      files: [],
      consultations: [],
      selectedId: '',
      recommendationForm: {
        deck: '',
        spreadName: '',
        cardCount: 3,
        spreadPositions: '',
        supportTools: '',
        reason: ''
      },
      drawDraft: null,
      finalReadingDraft: '',
      kakaoDraftDraft: ''
    };

    function setInfo(text) {
      state.statusType = 'info';
      state.statusText = text || '';
      render();
    }

    function setError(text) {
      state.statusType = 'error';
      state.statusText = text || '';
      render();
    }

    function selectedConsultation() {
      return state.consultations.find((item) => item.id === state.selectedId) || null;
    }

    function chipClass(status) {
      return `chip ${STATUS_ORDER.includes(status) ? status : 'submitted'}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function splitCsv(input) {
      if (!input) return [];
      return String(input).split(',').map((v) => v.trim()).filter(Boolean);
    }

    function buildMockRecommendation(question) {
      const text = String(question || '').toLowerCase();
      if (text.includes('연애') || text.includes('관계') || text.includes('재회')) {
        return {
          deck: '로제딕 타로',
          spreadName: '핵심 정리 3카드',
          cardCount: 3,
          spreadPositions: ['현재 상황', '고민의 핵심', '조언'],
          supportTools: ['레노먼드'],
          reason: '관계 흐름과 감정 해석을 함께 보기 좋은 구성입니다.'
        };
      }
      if (text.includes('이직') || text.includes('직장') || text.includes('사업')) {
        return {
          deck: '세피로트 타로',
          spreadName: '결정 정리 3카드',
          cardCount: 3,
          spreadPositions: ['현재 흐름', '변수', '조언'],
          supportTools: ['주역육효괘'],
          reason: '결정 포인트와 현실 흐름 정리에 적합한 구성입니다.'
        };
      }
      return {
        deck: '나전의 빛 타로',
        spreadName: '기본 3카드',
        cardCount: 3,
        spreadPositions: ['현재', '흐름', '조언'],
        supportTools: [],
        reason: '기본 상황 정리에 무난한 구성입니다.'
      };
    }

    function buildMockDraw(rec) {
      const positions = Array.isArray(rec.spreadPositions) ? rec.spreadPositions : [];
      const tarot = [];
      for (let i = 0; i < (rec.cardCount || 3); i++) {
        tarot.push({
          position: positions[i] || `카드 ${i + 1}`,
          card: `Mock Card ${i + 1}`
        });
      }
      return {
        tarotDeck: rec.deck || '',
        cardCount: rec.cardCount || 3,
        tarot,
        lenormand: (rec.supportTools || []).includes('레노먼드') ? ['6 구름', '33 열쇠'] : [],
        iching: (rec.supportTools || []).includes('주역육효괘') ? ['풍택중부'] : [],
        aux: []
      };
    }

    function buildStatusSteps(status) {
      const idx = STATUS_ORDER.indexOf(status || 'submitted');
      return STATUS_ORDER.map((code, i) => {
        const cls = `step ${i < idx ? 'done' : ''} ${i === idx ? 'active' : ''}`;
        return `<div class="${cls}">${i + 1}. ${STATUS_LABELS[code] || code}</div>`;
      }).join('');
    }

    async function checkSession() {
      try {
        const res = await fetch('/api/admin/session', { credentials: 'include' });
        if (!res.ok) {
          state.authenticated = false;
          render();
          return;
        }
        const data = await res.json();
        state.authenticated = !!(data.ok && data.authenticated);
        if (state.authenticated) {
          await Promise.all([fetchFiles(), fetchConsultations()]);
        }
      } catch (_) {
        state.authenticated = false;
      }
      render();
    }

    async function login() {
      const normalizedToken = state.token.trim();
      if (!normalizedToken) {
        setError('ADMIN_TOKEN을 입력해주세요.');
        return;
      }
      try {
        const res = await fetch('/api/admin/session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ token: normalizedToken })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '인증 실패');
        state.authenticated = true;
        await Promise.all([fetchFiles(), fetchConsultations()]);
        setInfo('로그인되었습니다.');
      } catch (e) {
        setError(e.message || '로그인 실패');
      }
    }

    async function logout() {
      try {
        await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
      } catch (_) {}
      state.authenticated = false;
      state.files = [];
      state.consultations = [];
      state.selectedId = '';
      setInfo('로그아웃 되었습니다.');
    }

    async function fetchFiles() {
      const res = await fetch('/api/admin/files', { credentials: 'include' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '파일 조회 실패');
      state.files = Array.isArray(data.files) ? data.files : [];
    }

    async function fetchConsultations() {
      const res = await fetch('/api/admin/consultations', { credentials: 'include' });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '접수 조회 실패');
      state.consultations = Array.isArray(data.consultations) ? data.consultations : [];
      if (!state.consultations.length) {
        state.selectedId = '';
      } else if (!state.selectedId || !state.consultations.some((v) => v.id === state.selectedId)) {
        state.selectedId = state.consultations[0].id;
      }
      syncSelected();
    }

    function syncSelected() {
      const current = selectedConsultation();
      if (!current) {
        state.recommendationForm = { deck: '', spreadName: '', cardCount: 3, spreadPositions: '', supportTools: '', reason: '' };
        state.drawDraft = null;
        state.finalReadingDraft = '';
        state.kakaoDraftDraft = '';
        return;
      }
      const rec = current.recommendation || {};
      state.recommendationForm = {
        deck: rec.deck || '',
        spreadName: rec.spreadName || '',
        cardCount: rec.cardCount || 3,
        spreadPositions: Array.isArray(rec.spreadPositions) ? rec.spreadPositions.join(', ') : '',
        supportTools: Array.isArray(rec.supportTools) ? rec.supportTools.join(', ') : '',
        reason: rec.reason || ''
      };
      state.drawDraft = current.drawResult || null;
      state.finalReadingDraft = current.finalReading || '';
      state.kakaoDraftDraft = current.kakaoDraft || '';
    }

    async function uploadFile() {
      const fileInput = document.getElementById('upload-file');
      const deck = document.getElementById('upload-deck').value.trim();
      const topic = document.getElementById('upload-topic').value.trim();
      const priority = document.getElementById('upload-priority').value;
      const type = document.getElementById('upload-type').value;
      const file = fileInput.files[0];
      if (!file) return setError('파일을 선택해주세요.');
      try {
        const body = new FormData();
        body.append('file', file);
        body.append('deck', deck);
        body.append('topic', topic);
        body.append('priority', priority);
        body.append('type', type);

        const res = await fetch('/api/admin/upload', {
          method: 'POST',
          credentials: 'include',
          body
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '업로드 실패');
        fileInput.value = '';
        await fetchFiles();
        setInfo('업로드 완료');
      } catch (e) {
        setError(e.message || '업로드 실패');
      }
    }

    async function patchConsultation(id, payload) {
      const res = await fetch(`/api/admin/consultations/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장 실패');
      await fetchConsultations();
      render();
    }

    async function confirmPayment(id) {
      try {
        await patchConsultation(id, { paymentStatus: 'paid', status: 'paid' });
        setInfo('입금 확인 완료');
      } catch (e) {
        setError(e.message);
      }
    }

    async function saveRecommendation() {
      const current = selectedConsultation();
      if (!current) return;
      const recommendation = {
        deck: state.recommendationForm.deck.trim(),
        spreadName: state.recommendationForm.spreadName.trim(),
        cardCount: Number(state.recommendationForm.cardCount) || 3,
        spreadPositions: splitCsv(state.recommendationForm.spreadPositions),
        supportTools: splitCsv(state.recommendationForm.supportTools),
        reason: state.recommendationForm.reason.trim()
      };
      try {
        await patchConsultation(current.id, { recommendation, status: 'recommended' });
        setInfo('추천 저장 완료');
      } catch (e) {
        setError(e.message);
      }
    }

    function generateRecommendation() {
      const current = selectedConsultation();
      if (!current) return;
      const rec = buildMockRecommendation(current.question || '');
      state.recommendationForm = {
        deck: rec.deck,
        spreadName: rec.spreadName,
        cardCount: rec.cardCount,
        spreadPositions: rec.spreadPositions.join(', '),
        supportTools: rec.supportTools.join(', '),
        reason: rec.reason
      };
      render();
    }

    function autoDraw() {
      const rec = {
        deck: state.recommendationForm.deck,
        spreadName: state.recommendationForm.spreadName,
        cardCount: Number(state.recommendationForm.cardCount) || 3,
        spreadPositions: splitCsv(state.recommendationForm.spreadPositions),
        supportTools: splitCsv(state.recommendationForm.supportTools),
        reason: state.recommendationForm.reason
      };
      state.drawDraft = buildMockDraw(rec);
      render();
    }

    async function lockDraw() {
      const current = selectedConsultation();
      if (!current || !state.drawDraft) return;
      try {
        await patchConsultation(current.id, { drawResult: state.drawDraft, status: 'drawn' });
        setInfo('드로우 잠금 완료');
      } catch (e) {
        setError(e.message);
      }
    }

    function generateFinalReading() {
      const current = selectedConsultation();
      if (!current) return;
      const deck = state.recommendationForm.deck || '타로';
      const spread = state.recommendationForm.spreadName || '기본 리딩';
      state.finalReadingDraft =
`내담자님, 지금 질문을 보면 단순히 결과만 알고 싶다기보다 지금 흐름이 어디로 가고 있는지, 그리고 내가 어떤 태도를 취해야 하는지를 정리받고 싶은 마음이 커 보여요. 이번 리딩은 ${deck}와 ${spread} 기준으로 정리해봤고, 전체적으로는 감정은 분명 존재하지만 현실적인 변수도 같이 움직이는 흐름으로 읽혀요.

지금은 마음만 앞서서 결론을 빨리 내리기보다, 현재 상황을 있는 그대로 보는 시선이 중요해 보여요. 기대와 불안이 같이 섞여 있으면 상대의 작은 반응 하나에도 의미를 크게 부여하게 되는데, 이번 흐름은 그렇게 흔들리기보다 내담자님 기준을 다시 세우는 쪽이 더 유리해요.

당장 크게 밀어붙이기보다는 한 번 더 흐름을 보고, 내가 진짜 확인하고 싶은 포인트를 좁혀서 움직이는 게 좋아 보여요. 마음은 급할 수 있지만, 오히려 천천히 정리할수록 결과가 더 선명해질 가능성이 높아요. 결국 이 리딩의 핵심은 감정에 휩쓸리기보다, 내담자님이 선택권을 가진 사람이라는 점을 잊지 않는 거예요.`;
      render();
    }

    async function saveFinalReading() {
      const current = selectedConsultation();
      if (!current) return;
      try {
        await patchConsultation(current.id, { finalReading: state.finalReadingDraft, status: 'finalized' });
        setInfo('최종 리딩 저장 완료');
      } catch (e) {
        setError(e.message);
      }
    }

    function makeKakaoDraft() {
      const current = selectedConsultation();
      if (!current) return;
      state.kakaoDraftDraft =
`안녕하세요, 내담자님.\n접수해주신 ${current.menuTitle || '리딩'} 정리본 보내드려요.\n\n${state.finalReadingDraft || ''}`;
      render();
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text || '');
        setInfo('복사 완료');
      } catch (_) {
        setError('복사 실패');
      }
    }

    function renderLogin() {
      return `
        <div class="login-shell">
          <div class="card login-card">
            <h1 style="margin-top:0;">Regina Admin Login</h1>
            <p class="muted">관리자 토큰으로 로그인 후 대시보드 기능을 사용할 수 있습니다.</p>
            <div class="field">
              <label>Admin Token</label>
              <input id="login-token" value="${escapeHtml(state.token)}" placeholder="ADMIN_TOKEN 입력" />
            </div>
            <div class="row">
              <button class="primary" id="login-btn">로그인</button>
            </div>
            ${state.statusText ? `<div class="${state.statusType === 'error' ? 'msg-error' : 'msg-info'}">${escapeHtml(state.statusText)}</div>` : ''}
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      const current = selectedConsultation();
      return `
        <div class="wrap">
          <h1>Regina Admin Dashboard</h1>

          <div class="card">
            <div class="row">
              <div class="field">
                <label>Admin Token</label>
                <input id="top-token" value="${escapeHtml(state.token)}" placeholder="ADMIN_TOKEN 입력" />
              </div>
              <div></div>
            </div>
            <div class="row">
              <button class="primary" id="login-btn-top">세션 로그인</button>
              <button class="danger" id="logout-btn">로그아웃</button>
              <button class="primary" id="refresh-files-btn">파일 목록 새로고침</button>
              <button class="primary" id="refresh-consultations-btn">접수 목록 새로고침</button>
            </div>
            ${state.statusText ? `<div class="${state.statusType === 'error' ? 'msg-error' : 'msg-info'}">${escapeHtml(state.statusText)}</div>` : ''}
          </div>

          <div class="card">
            <h3>내부 도구 바로가기</h3>
            <div class="row">
              ${INTERNAL_TOOLS.map(tool => `<a class="tool-btn" href="${tool.url}" target="_blank" rel="noopener noreferrer">${tool.label}</a>`).join('')}
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <h3>상담 접수 목록</h3>
              <table>
                <thead>
                  <tr>
                    <th>접수시각</th>
                    <th>메뉴/이름</th>
                    <th>가격</th>
                    <th>payment/status</th>
                    <th>작업</th>
                  </tr>
                </thead>
                <tbody>
                  ${state.consultations.map(c => `
                    <tr class="clickable ${state.selectedId === c.id ? 'selected' : ''}" data-select-id="${c.id}">
                      <td>${escapeHtml(c.createdAt ? new Date(c.createdAt).toLocaleString('ko-KR') : '-')}</td>
                      <td>
                        <div>${escapeHtml(c.menuTitle || '-')}</div>
                        <div class="muted">${escapeHtml((c.name || '-') + ' / ' + (c.contactChannel || '-'))}</div>
                      </td>
                      <td>${typeof c.price === 'number' ? `${c.price.toLocaleString('ko-KR')}원` : '-'}</td>
                      <td>
                        <div><span class="chip payment">${escapeHtml(c.paymentStatus || (c.paymentConfirmed ? 'paid' : 'unpaid'))}</span></div>
                        <div style="margin-top:4px;"><span class="${chipClass(c.status)}">${escapeHtml(c.status || 'submitted')}</span></div>
                      </td>
                      <td>
                        ${!c.paymentConfirmed ? `<button class="primary" data-pay-id="${c.id}">입금 확인</button>` : `<div class="muted">입금확인</div>`}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div class="card">
              <h3>선택 접수 상세 작업 패널</h3>
              ${!current ? `<div class="muted">왼쪽 목록에서 접수건을 선택해주세요.</div>` : `
                <div class="card" style="margin-bottom:12px;background:#0f172a;">
                  <h4>접수 정보</h4>
                  <p><strong>접수번호</strong> ${escapeHtml(current.id)}</p>
                  <p><strong>이름</strong> ${escapeHtml(current.name || '-')}</p>
                  <p><strong>연락채널</strong> ${escapeHtml(current.contactChannel || '-')}</p>
                  <p><strong>메뉴명</strong> ${escapeHtml(current.menuTitle || '-')}</p>
                  <p><strong>가격</strong> ${typeof current.price === 'number' ? `${current.price.toLocaleString('ko-KR')}원` : '-'}</p>
                  <p><strong>질문</strong> ${escapeHtml(current.question || '-')}</p>
                  <p><strong>메모</strong> ${escapeHtml(current.memo || '-')}</p>
                </div>

                <div class="card" style="margin-bottom:12px;background:#0f172a;">
                  <h4>처리 상태</h4>
                  <div class="status-steps">${buildStatusSteps(current.status || 'submitted')}</div>
                </div>

                <div class="card" style="margin-bottom:12px;background:#0f172a;">
                  <h4>AI 추천</h4>
                  <div class="detail-grid">
                    <div class="field"><label>deck</label><input id="rec-deck" value="${escapeHtml(state.recommendationForm.deck)}" /></div>
                    <div class="field"><label>spreadName</label><input id="rec-spread" value="${escapeHtml(state.recommendationForm.spreadName)}" /></div>
                    <div class="field"><label>cardCount</label><input id="rec-count" type="number" min="1" value="${escapeHtml(state.recommendationForm.cardCount)}" /></div>
                    <div class="field"><label>spreadPositions</label><input id="rec-positions" value="${escapeHtml(state.recommendationForm.spreadPositions)}" /></div>
                    <div class="field full"><label>supportTools</label><input id="rec-tools" value="${escapeHtml(state.recommendationForm.supportTools)}" /></div>
                    <div class="field full"><label>reason</label><textarea id="rec-reason">${escapeHtml(state.recommendationForm.reason)}</textarea></div>
                  </div>
                  <div class="row">
                    <button class="primary" id="gen-rec-btn">추천 생성</button>
                    <button class="primary" id="save-rec-btn">추천 저장</button>
                  </div>
                </div>

                <div class="card" style="margin-bottom:12px;background:#0f172a;">
                  <h4>자동 드로우</h4>
                  <div class="row">
                    <button class="primary" id="auto-draw-btn">추천값으로 자동 드로우</button>
                    <button class="primary" id="lock-draw-btn">결과 잠금</button>
                  </div>
                  ${state.drawDraft ? `<pre class="codebox">${escapeHtml(JSON.stringify(state.drawDraft, null, 2))}</pre>` : `<div class="muted">드로우 결과가 없습니다.</div>`}
                </div>

                <div class="card" style="margin-bottom:12px;background:#0f172a;">
                  <h4>최종 리딩</h4>
                  <div class="row">
                    <button class="primary" id="gen-final-btn">최종 리딩 생성</button>
                    <button class="primary" id="save-final-btn">저장</button>
                    <button class="primary" id="copy-final-btn">복사</button>
                  </div>
                  <textarea id="final-reading">${escapeHtml(state.finalReadingDraft)}</textarea>
                </div>

                <div class="card" style="background:#0f172a;">
                  <h4>카톡용 문구</h4>
                  <div class="row">
                    <button class="primary" id="make-kakao-btn">카톡용 짧은 버전 만들기</button>
                    <button class="primary" id="copy-kakao-btn">카톡 문구 복사</button>
                  </div>
                  <textarea id="kakao-draft">${escapeHtml(state.kakaoDraftDraft)}</textarea>
                </div>
              `}
            </div>
          </div>

          <div class="card">
            <h3>지식 파일 업로드</h3>
            <div class="row">
              <input id="upload-deck" placeholder="deck" />
              <input id="upload-topic" placeholder="topic" />
              <select id="upload-priority">
                <option value="core">core</option>
                <option value="support">support</option>
                <option value="optional">optional</option>
              </select>
              <select id="upload-type">
                <option value="guidebook">guidebook</option>
                <option value="interpretation">interpretation</option>
                <option value="tone">tone</option>
                <option value="rule">rule</option>
              </select>
            </div>
            <div class="row">
              <input id="upload-file" type="file" />
              <button class="primary" id="upload-btn">업로드</button>
            </div>
          </div>

          <div class="card">
            <h3>파일 목록</h3>
            <table>
              <thead>
                <tr>
                  <th>파일명/크기</th>
                  <th>deck/topic</th>
                  <th>priority/type</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody>
                ${state.files.map(f => `
                  <tr>
                    <td>
                      <div>${escapeHtml(f.originalName || f.storedName || '-')}</div>
                      <div class="muted">${escapeHtml(typeof f.size === 'number' ? `${(f.size / 1024).toFixed(1)} KB` : '-')}</div>
                    </td>
                    <td>${escapeHtml((f.deck || '-') + ' / ' + (f.topic || '-'))}</td>
                    <td>${escapeHtml((f.priority || '-') + ' / ' + (f.type || '-'))}</td>
                    <td><span class="chip">${escapeHtml(f.status || '-')}</span></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function bindEvents() {
      const loginBtn = document.getElementById('login-btn');
      if (loginBtn) {
        loginBtn.onclick = async () => {
          state.token = document.getElementById('login-token').value;
          await login();
        };
      }

      const topToken = document.getElementById('top-token');
      if (topToken) topToken.oninput = (e) => { state.token = e.target.value; };

      const topLoginBtn = document.getElementById('login-btn-top');
      if (topLoginBtn) topLoginBtn.onclick = login;

      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) logoutBtn.onclick = logout;

      const refreshFilesBtn = document.getElementById('refresh-files-btn');
      if (refreshFilesBtn) refreshFilesBtn.onclick = async () => {
        try { await fetchFiles(); setInfo(`총 ${state.files.length}개 파일`); render(); }
        catch (e) { setError(e.message); }
      };

      const refreshConsultationsBtn = document.getElementById('refresh-consultations-btn');
      if (refreshConsultationsBtn) refreshConsultationsBtn.onclick = async () => {
        try { await fetchConsultations(); setInfo(`총 ${state.consultations.length}개 접수`); render(); }
        catch (e) { setError(e.message); }
      };

      const uploadBtn = document.getElementById('upload-btn');
      if (uploadBtn) uploadBtn.onclick = uploadFile;

      document.querySelectorAll('[data-select-id]').forEach((el) => {
        el.onclick = () => {
          state.selectedId = el.getAttribute('data-select-id');
          syncSelected();
          render();
        };
      });

      document.querySelectorAll('[data-pay-id]').forEach((el) => {
        el.onclick = async (e) => {
          e.stopPropagation();
          await confirmPayment(el.getAttribute('data-pay-id'));
        };
      });

      const genRecBtn = document.getElementById('gen-rec-btn');
      if (genRecBtn) genRecBtn.onclick = generateRecommendation;

      const saveRecBtn = document.getElementById('save-rec-btn');
      if (saveRecBtn) saveRecBtn.onclick = async () => {
        state.recommendationForm.deck = document.getElementById('rec-deck').value;
        state.recommendationForm.spreadName = document.getElementById('rec-spread').value;
        state.recommendationForm.cardCount = document.getElementById('rec-count').value;
        state.recommendationForm.spreadPositions = document.getElementById('rec-positions').value;
        state.recommendationForm.supportTools = document.getElementById('rec-tools').value;
        state.recommendationForm.reason = document.getElementById('rec-reason').value;
        await saveRecommendation();
      };

      const autoDrawBtn = document.getElementById('auto-draw-btn');
      if (autoDrawBtn) autoDrawBtn.onclick = autoDraw;

      const lockDrawBtn = document.getElementById('lock-draw-btn');
      if (lockDrawBtn) lockDrawBtn.onclick = lockDraw;

      const genFinalBtn = document.getElementById('gen-final-btn');
      if (genFinalBtn) genFinalBtn.onclick = generateFinalReading;

      const saveFinalBtn = document.getElementById('save-final-btn');
      if (saveFinalBtn) saveFinalBtn.onclick = async () => {
        state.finalReadingDraft = document.getElementById('final-reading').value;
        await saveFinalReading();
      };

      const copyFinalBtn = document.getElementById('copy-final-btn');
      if (copyFinalBtn) copyFinalBtn.onclick = () => {
        state.finalReadingDraft = document.getElementById('final-reading').value;
        copyText(state.finalReadingDraft);
      };

      const makeKakaoBtn = document.getElementById('make-kakao-btn');
      if (makeKakaoBtn) makeKakaoBtn.onclick = makeKakaoDraft;

      const copyKakaoBtn = document.getElementById('copy-kakao-btn');
      if (copyKakaoBtn) copyKakaoBtn.onclick = () => {
        state.kakaoDraftDraft = document.getElementById('kakao-draft').value;
        copyText(state.kakaoDraftDraft);
      };
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = state.authenticated ? renderDashboard() : renderLogin();
      bindEvents();
    }

    render();
    checkSession();
  </script>
</body>
</html>
