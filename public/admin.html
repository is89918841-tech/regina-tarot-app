<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regina Admin Dashboard</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #020617; color: #e2e8f0; }
      .wrap { max-width: 1320px; margin: 0 auto; padding: 20px; }
      .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
      input, select, button, textarea { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
      textarea { width: 100%; min-height: 80px; resize: vertical; }
      button { cursor: pointer; }
      button:disabled { opacity: .55; cursor: not-allowed; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; border-bottom: 1px solid #334155; padding: 8px; font-size: 14px; vertical-align: top; }
      tr.clickable { cursor: pointer; }
      tr.clickable:hover { background: rgba(59, 130, 246, 0.12); }
      tr.selected { background: rgba(59, 130, 246, 0.22); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .row > * { flex: 1; min-width: 120px; }
      .danger { background: #b91c1c; border: 0; }
      .primary { background: #2563eb; border: 0; }
      .tool-btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; background: #0b3b2e; color: #d1fae5; border: 1px solid #065f46; padding: 10px 14px; border-radius: 10px; font-weight: 600; }
      .tool-btn:hover { background: #0f513f; }
      .muted { color: #94a3b8; font-size: 12px; }
      .status { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
      .s-processed { background: #065f46; }
      .s-processing { background: #92400e; }
      .s-error { background: #7f1d1d; }
      .s-uploaded, .s-saved { background: #1e3a8a; }
      .msg-error { color: #fecaca; }
      .msg-info { color: #bfdbfe; }
      .chip { display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px; background: #334155; }
      .chip.submitted { background:#475569; }
      .chip.paid { background:#a16207; }
      .chip.recommended { background:#1d4ed8; }
      .chip.drawn { background:#6d28d9; }
      .chip.finalized { background:#166534; }
      .chip.sent { background:#0f766e; }
      .chip.payment { background:#7c3aed; }
      .layout-2col { display: grid; grid-template-columns: minmax(420px, 1fr) minmax(520px, 1.2fr); gap: 16px; }
      .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .login-card { width: 100%; max-width: 460px; }
      .section-title { margin: 0 0 8px; font-size: 16px; }
      .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(180px, 1fr)); gap: 10px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field.full { grid-column: 1 / -1; }
      .kv { margin: 0; }
      .kv strong { display: inline-block; min-width: 90px; color: #cbd5e1; }
      .status-steps { display: flex; flex-wrap: wrap; gap: 8px; }
      .step { padding: 6px 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; font-size: 12px; }
      .step.active { border-color: #60a5fa; box-shadow: 0 0 0 1px #60a5fa inset; }
      .step.done { border-color: #22c55e; }
      pre.codebox { margin: 8px 0 0; background: #0b1220; border: 1px solid #334155; border-radius: 10px; padding: 10px; overflow: auto; font-size: 12px; }
      @media (max-width: 1100px) { .layout-2col { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const { useState, useEffect, useMemo } = React;
      const MAX_FILE_MB = 100;
      const STATUS_ORDER = ['submitted', 'paid', 'recommended', 'drawn', 'finalized', 'sent'];
      const STATUS_LABELS = {
        submitted: '접수됨',
        paid: '결제확인',
        recommended: '추천생성',
        drawn: '자동드로우',
        finalized: '최종리딩',
        sent: '전송완료',
      };
      const INTERNAL_TOOLS = [
        { label: '리딩 보조앱 열기', url: 'https://regina-tarot-app.onrender.com/admin/helper' },
        { label: '그랑따블로 열기', url: 'https://regina-tarot-app.onrender.com/admin/grand-tableau' },
      ];

      const MOCK_TAROT_CARDS = [
        'The Fool', 'The Magician', 'The High Priestess', 'The Empress', 'The Emperor',
        'The Hierophant', 'The Lovers', 'The Chariot', 'Strength', 'The Hermit',
        'Wheel of Fortune', 'Justice', 'The Hanged Man', 'Death', 'Temperance', 'The Devil',
        'The Tower', 'The Star', 'The Moon', 'The Sun', 'Judgement', 'The World',
        'Ace of Cups', 'Ace of Pentacles', 'Queen of Swords', 'King of Wands'
      ];

      function formatBytes(bytes) {
        if (!bytes && bytes !== 0) return '-';
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
      }

      function splitCsv(input) {
        if (!input) return [];
        return String(input).split(',').map((v) => v.trim()).filter(Boolean);
      }

      function joinCsv(arr) {
        if (!Array.isArray(arr) || arr.length === 0) return '';
        return arr.join(', ');
      }

      function getChipClass(status) {
        const safe = STATUS_ORDER.includes(status) ? status : 'submitted';
        return `chip ${safe}`;
      }

      function buildMockRecommendation(question) {
        const text = String(question || '').toLowerCase();
        if (text.includes('연애') || text.includes('관계') || text.includes('재회')) {
          return {
            deck: '로제딕 타로',
            spreadName: '핵심 정리 3카드',
            cardCount: 3,
            spreadPositions: ['현재 상황', '고민의 핵심', '조언'],
            supportTools: ['레노먼드'],
            reason: '관계 흐름과 선택 지점을 간결하게 확인하기 적합한 구성입니다.',
          };
        }
        if (text.includes('이직') || text.includes('직장') || text.includes('사업')) {
          return {
            deck: '세피로트 타로',
            spreadName: '의사결정 3카드',
            cardCount: 3,
            spreadPositions: ['현실 조건', '리스크', '실행 조언'],
            supportTools: ['주역'],
            reason: '실행 가능성과 리스크 균형을 보기에 적합한 질문 유형입니다.',
          };
        }
        return {
          deck: '로제딕 타로',
          spreadName: '기본 3카드',
          cardCount: 3,
          spreadPositions: ['현재', '흐름', '조언'],
          supportTools: ['레노먼드', '귀문방'],
          reason: '질문의 핵심 흐름을 빠르게 요약하기 위한 기본 추천입니다.',
        };
      }

      function shuffle(array) {
        const out = [...array];
        for (let i = out.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      function buildMockDrawResult(recommendation) {
        const rec = recommendation || {};
        const cardCount = Math.max(1, Number(rec.cardCount) || 3);
        const positions = Array.isArray(rec.spreadPositions) && rec.spreadPositions.length > 0
          ? rec.spreadPositions
          : Array.from({ length: cardCount }, (_, idx) => `포지션 ${idx + 1}`);

        const picked = shuffle(MOCK_TAROT_CARDS).slice(0, cardCount);
        const tarot = picked.map((card, idx) => ({
          position: positions[idx] || `포지션 ${idx + 1}`,
          card,
        }));

        const tools = Array.isArray(rec.supportTools) ? rec.supportTools : [];

        return {
          tarotDeck: rec.deck || '로제딕 타로',
          cardCount,
          tarot,
          runes: tools.includes('룬') ? ['ᚠ Fehu'] : [],
          lenormand: tools.includes('레노먼드') ? ['22 갈림길'] : [],
          iching: tools.includes('주역') ? ['수화기제'] : [],
          oracles: tools.includes('오라클') ? ['Trust the timing'] : [],
          aux: tools.includes('귀문방') ? ['귀문방: 무명귀 (역방향)'] : [],
          locked: false,
        };
      }

      function buildFinalReading(consultation) {
        const rec = consultation.recommendation || {};
        const draw = consultation.drawResult || {};
        const tarotLines = Array.isArray(draw.tarot)
          ? draw.tarot.map((item) => `- ${item.position}: ${item.card}`).join('\n')
          : '';
        return [
          `질문: ${consultation.question || '-'}`,
          '',
          `[추천 구성]`,
          `덱: ${rec.deck || '-'}`,
          `스프레드: ${rec.spreadName || '-'} (${rec.cardCount || '-' }장)`,
          `포지션: ${Array.isArray(rec.spreadPositions) ? rec.spreadPositions.join(' / ') : '-'}`,
          `보조도구: ${Array.isArray(rec.supportTools) ? rec.supportTools.join(', ') : '-'}`,
          `추천 이유: ${rec.reason || '-'}`,
          '',
          `[드로우 결과]`,
          tarotLines || '- 카드 결과 없음',
          draw.lenormand && draw.lenormand.length ? `레노먼드: ${draw.lenormand.join(', ')}` : '',
          draw.aux && draw.aux.length ? `보조: ${draw.aux.join(', ')}` : '',
          '',
          `종합: 현재 흐름을 명확히 정리하고, 단기 선택보다 실행 순서를 먼저 확정하는 것이 좋습니다.`,
        ].filter(Boolean).join('\n');
      }

      async function copyText(text) {
        if (!text) return false;
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (_) {
          return false;
        }
      }

      function App() {
        const [token, setToken] = useState('');
        const [authenticated, setAuthenticated] = useState(false);
        const [files, setFiles] = useState([]);
        const [consultations, setConsultations] = useState([]);
        const [selectedId, setSelectedId] = useState('');
        const [status, setStatus] = useState({ type: 'info', text: '' });
        const [uploading, setUploading] = useState(false);
        const [form, setForm] = useState({ deck: '', topic: '', priority: 'core', type: 'guidebook', files: [] });
        const [recommendationForm, setRecommendationForm] = useState({
          deck: '', spreadName: '', cardCount: 3, spreadPositions: '', supportTools: '', reason: '',
        });
        const [drawDraft, setDrawDraft] = useState(null);
        const [finalReadingDraft, setFinalReadingDraft] = useState('');
        const [kakaoDraftDraft, setKakaoDraftDraft] = useState('');

        const selectedConsultation = useMemo(
          () => consultations.find((item) => item.id === selectedId) || null,
          [consultations, selectedId]
        );

        function setError(text) { setStatus({ type: 'error', text }); }
        function setInfo(text) { setStatus({ type: 'info', text }); }

        useEffect(() => {
          const params = new URLSearchParams(window.location.search);
          const authState = params.get('auth');
          if (authState === 'required') {
            setStatus({ type: 'info', text: '관리자 도구는 로그인 후 접근할 수 있습니다. 먼저 로그인해주세요.' });
          }
        }, []);

        useEffect(() => {
          (async () => {
            try {
              const res = await fetch('/api/admin/session', { credentials: 'include' });
              if (!res.ok) return setAuthenticated(false);
              const data = await res.json();
              if (data.ok && data.authenticated) {
                setAuthenticated(true);
                await Promise.all([fetchFiles(), fetchConsultations()]);
              }
            } catch (_) {
              setAuthenticated(false);
            }
          })();
        }, []);

        useEffect(() => {
          if (!consultations.length) {
            setSelectedId('');
            return;
          }
          if (!selectedId || !consultations.some((item) => item.id === selectedId)) {
            setSelectedId(consultations[0].id);
          }
        }, [consultations, selectedId]);

        useEffect(() => {
          if (!selectedConsultation) {
            setRecommendationForm({ deck: '', spreadName: '', cardCount: 3, spreadPositions: '', supportTools: '', reason: '' });
            setDrawDraft(null);
            setFinalReadingDraft('');
            setKakaoDraftDraft('');
            return;
          }

          const rec = selectedConsultation.recommendation || {};
          setRecommendationForm({
            deck: rec.deck || '',
            spreadName: rec.spreadName || '',
            cardCount: rec.cardCount || 3,
            spreadPositions: joinCsv(rec.spreadPositions),
            supportTools: joinCsv(rec.supportTools),
            reason: rec.reason || '',
          });
          setDrawDraft(selectedConsultation.drawResult || null);
          setFinalReadingDraft(selectedConsultation.finalReading || '');
          setKakaoDraftDraft(selectedConsultation.kakaoDraft || '');
        }, [selectedConsultation]);

        async function login() {
          try {
            const res = await fetch('/api/admin/session', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({ token }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '인증 실패');
            setAuthenticated(true);
            await Promise.all([fetchFiles(), fetchConsultations()]);
            setInfo('로그인되었습니다.');
          } catch (e) {
            setError(e.message);
          }
        }

        async function logout() {
          await fetch('/api/admin/logout', { method: 'POST', credentials: 'include' });
          setAuthenticated(false);
          setFiles([]);
          setConsultations([]);
          setToken('');
          setInfo('로그아웃 되었습니다.');
        }

        async function fetchFiles() {
          try {
            const res = await fetch('/api/admin/files', { credentials: 'include' });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '조회 실패');
            setFiles(data.files);
          } catch (e) {
            setError(e.message);
          }
        }

        async function fetchConsultations() {
          try {
            const res = await fetch('/api/admin/consultations', { credentials: 'include' });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '접수 목록 조회 실패');
            setConsultations(data.consultations || []);
          } catch (e) {
            setError(e.message);
          }
        }

        async function patchConsultation(id, payload) {
          const res = await fetch(`/api/admin/consultations/${id}`, {
            method: 'PATCH',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || '상담 업데이트 실패');
          return data.consultation;
        }

        async function confirmPayment(id) {
          try {
            const res = await fetch(`/api/consultations/${id}/confirm-payment`, { method: 'POST', credentials: 'include' });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '입금 확인 실패');
            await fetchConsultations();
            setInfo('입금 확인 처리 완료');
          } catch (e) { setError(e.message); }
        }

        async function runAutoReading(id) {
          try {
            const res = await fetch(`/api/consultations/${id}/run-auto-reading`, { method: 'POST', credentials: 'include' });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '자동 리딩 실행 실패');
            await fetchConsultations();
            setInfo('자동 리딩 실행 완료');
          } catch (e) { setError(e.message); }
        }

        async function upload() {
          if (!form.files || form.files.length === 0) return setError('파일을 선택해주세요.');
          if (!authenticated) return setError('먼저 인증해주세요.');

          const fileMb = form.files[0].size / (1024 * 1024);
          if (fileMb > MAX_FILE_MB) return setError(`파일 크기가 ${MAX_FILE_MB}MB를 초과했어요.`);

          setUploading(true);
          try {
            for (const file of form.files) {
              const body = new FormData();
              body.append('file', file);
              body.append('deck', form.deck);
              body.append('topic', form.topic);
              body.append('priority', form.priority);
              body.append('type', form.type);

              const res = await fetch('/api/admin/upload', { method: 'POST', credentials: 'include', body });
              const data = await res.json();
              if (!data.ok) throw new Error(`${file.name} 업로드 실패`);
            }
            await fetchFiles();
            setInfo('파일 업로드 완료');
          } catch (e) {
            setError(e.message);
          } finally {
            setUploading(false);
          }
        }

        async function updateRow(file) {
          try {
            const res = await fetch(`/api/admin/files/${file.id}`, {
              method: 'PATCH',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(file),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '수정 실패');
            await fetchFiles();
          } catch (e) { setError(e.message); }
        }

        async function removeRow(id) {
          if (!confirm('삭제할까요?')) return;
          try {
            const res = await fetch(`/api/admin/files/${id}`, { method: 'DELETE', credentials: 'include' });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '삭제 실패');
            await fetchFiles();
          } catch (e) { setError(e.message); }
        }

        async function handleGenerateRecommendation() {
          if (!selectedConsultation) return;
          const mock = buildMockRecommendation(selectedConsultation.question);
          setRecommendationForm({
            deck: mock.deck,
            spreadName: mock.spreadName,
            cardCount: mock.cardCount,
            spreadPositions: joinCsv(mock.spreadPositions),
            supportTools: joinCsv(mock.supportTools),
            reason: mock.reason,
          });
          setInfo('추천 초안을 생성했습니다. 필요한 경우 수정 후 저장하세요.');
        }

        async function handleSaveRecommendation() {
          if (!selectedConsultation) return;
          try {
            const recommendation = {
              deck: recommendationForm.deck.trim(),
              spreadName: recommendationForm.spreadName.trim(),
              cardCount: Number(recommendationForm.cardCount) || 3,
              spreadPositions: splitCsv(recommendationForm.spreadPositions),
              supportTools: splitCsv(recommendationForm.supportTools),
              reason: recommendationForm.reason.trim(),
            };
            await patchConsultation(selectedConsultation.id, {
              recommendation,
              status: 'recommended',
            });
            await fetchConsultations();
            setInfo('추천 저장 완료');
          } catch (e) {
            setError(e.message);
          }
        }

        async function handleAutoDraw() {
          if (!selectedConsultation) return;
          const recommendation = {
            deck: recommendationForm.deck.trim(),
            spreadName: recommendationForm.spreadName.trim(),
            cardCount: Number(recommendationForm.cardCount) || 3,
            spreadPositions: splitCsv(recommendationForm.spreadPositions),
            supportTools: splitCsv(recommendationForm.supportTools),
            reason: recommendationForm.reason.trim(),
          };
          const result = buildMockDrawResult(recommendation);
          setDrawDraft(result);
          setInfo('자동 드로우 결과를 생성했습니다. 잠금 후 저장하세요.');
        }

        async function handleRedraw() {
          await handleAutoDraw();
        }

        async function handleLockDraw() {
          if (!selectedConsultation || !drawDraft) return;
          try {
            const locked = { ...drawDraft, locked: true };
            await patchConsultation(selectedConsultation.id, {
              drawResult: locked,
              status: 'drawn',
            });
            await fetchConsultations();
            setInfo('드로우 결과 잠금 및 저장 완료');
          } catch (e) {
            setError(e.message);
          }
        }

        async function handleGenerateFinalReading() {
          if (!selectedConsultation) return;
          const merged = {
            ...selectedConsultation,
            recommendation: {
              deck: recommendationForm.deck.trim(),
              spreadName: recommendationForm.spreadName.trim(),
              cardCount: Number(recommendationForm.cardCount) || 3,
              spreadPositions: splitCsv(recommendationForm.spreadPositions),
              supportTools: splitCsv(recommendationForm.supportTools),
              reason: recommendationForm.reason.trim(),
            },
            drawResult: drawDraft,
          };
          const text = buildFinalReading(merged);
          setFinalReadingDraft(text);
          setInfo('최종 리딩 초안을 생성했습니다.');
        }

        async function handleSaveFinalReading() {
          if (!selectedConsultation) return;
          try {
            await patchConsultation(selectedConsultation.id, {
              finalReading: finalReadingDraft,
              status: 'finalized',
            });
            await fetchConsultations();
            setInfo('최종 리딩 저장 완료');
          } catch (e) {
            setError(e.message);
          }
        }

        async function handleCopyFinalReading() {
          const ok = await copyText(finalReadingDraft);
          if (ok) setInfo('최종 리딩 복사 완료');
          else setError('복사 실패: 브라우저 권한을 확인해주세요.');
        }

        async function handleMakeKakaoDraft() {
          if (!selectedConsultation) return;
          const text = `안녕하세요. 접수해주신 [${selectedConsultation.menuTitle || '상담'}] 리딩 정리본 보내드려요.\n\n${finalReadingDraft || ''}`;
          setKakaoDraftDraft(text);
          try {
            await patchConsultation(selectedConsultation.id, { kakaoDraft: text });
            await fetchConsultations();
            setInfo('카톡용 문구 생성 및 저장 완료');
          } catch (e) {
            setError(e.message);
          }
        }

        async function handleCopyKakaoDraft() {
