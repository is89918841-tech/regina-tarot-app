<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regina Admin Dashboard</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #020617; color: #e2e8f0; }
      .wrap { max-width: 980px; margin: 0 auto; padding: 20px; }
      .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
      input, select, button { padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; border-bottom: 1px solid #334155; padding: 8px; font-size: 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
      .row > * { flex: 1; min-width: 140px; }
      .danger { background: #b91c1c; border: 0; }
      .primary { background: #2563eb; border: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      const { useState, useEffect } = React;

      function App() {
        const [token, setToken] = useState(localStorage.getItem('regina_admin_token') || '');
        const [files, setFiles] = useState([]);
        const [status, setStatus] = useState('');
        const [uploading, setUploading] = useState(false);
        const [form, setForm] = useState({ deck: '', topic: '', priority: 'core', type: 'guidebook', file: null });

        const headers = token ? { 'x-admin-token': token } : {};

        useEffect(() => {
          localStorage.setItem('regina_admin_token', token);
        }, [token]);

        async function fetchFiles() {
          try {
            const res = await fetch('/api/admin/files', { headers });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '조회 실패');
            setFiles(data.files);
          } catch (e) {
            setStatus(e.message);
          }
        }

        async function upload() {
          if (!form.file) return setStatus('파일을 선택해주세요.');
          setUploading(true);
          setStatus('업로드 중...');

          try {
            const contentBase64 = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => {
                const result = String(reader.result || '');
                resolve(result.split(',')[1] || '');
              };
              reader.onerror = () => reject(new Error('파일 읽기 실패'));
              reader.readAsDataURL(form.file);
            });

            const res = await fetch('/api/admin/upload', {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                filename: form.file.name,
                mimeType: form.file.type,
                contentBase64,
                deck: form.deck,
                topic: form.topic,
                priority: form.priority,
                type: form.type,
              }),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '업로드 실패');

            setStatus('업로드 완료');
            setForm({ deck: '', topic: '', priority: 'core', type: 'guidebook', file: null });
            await fetchFiles();
          } catch (e) {
            setStatus(e.message);
          } finally {
            setUploading(false);
          }
        }

        async function updateRow(file) {
          try {
            const res = await fetch(`/api/admin/files/${file.id}`, {
              method: 'PATCH',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify(file),
            });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '수정 실패');
            setStatus('메타데이터 수정 완료');
            await fetchFiles();
          } catch (e) {
            setStatus(e.message);
          }
        }

        async function removeRow(id) {
          if (!confirm('삭제할까요?')) return;
          try {
            const res = await fetch(`/api/admin/files/${id}`, { method: 'DELETE', headers });
            const data = await res.json();
            if (!data.ok) throw new Error(data.error || '삭제 실패');
            await fetchFiles();
          } catch (e) {
            setStatus(e.message);
          }
        }

        return React.createElement('div', { className: 'wrap' },
          React.createElement('h1', null, 'Regina Admin Dashboard'),
          React.createElement('div', { className: 'card' },
            React.createElement('label', null, 'Admin Token'),
            React.createElement('input', { value: token, onChange: (e) => setToken(e.target.value), placeholder: 'x-admin-token 값' }),
            React.createElement('button', { className: 'primary', onClick: fetchFiles, style: { marginTop: '8px' } }, '파일 목록 새로고침')
          ),
          React.createElement('div', { className: 'card' },
            React.createElement('h3', null, '지식 파일 업로드'),
            React.createElement('div', { className: 'row' },
              React.createElement('input', { value: form.deck, placeholder: 'deck', onChange: (e) => setForm({ ...form, deck: e.target.value }) }),
              React.createElement('input', { value: form.topic, placeholder: 'topic', onChange: (e) => setForm({ ...form, topic: e.target.value }) }),
              React.createElement('select', { value: form.priority, onChange: (e) => setForm({ ...form, priority: e.target.value }) },
                React.createElement('option', { value: 'core' }, 'core'),
                React.createElement('option', { value: 'support' }, 'support'),
                React.createElement('option', { value: 'optional' }, 'optional')
              ),
              React.createElement('select', { value: form.type, onChange: (e) => setForm({ ...form, type: e.target.value }) },
                React.createElement('option', { value: 'guidebook' }, 'guidebook'),
                React.createElement('option', { value: 'interpretation' }, 'interpretation'),
                React.createElement('option', { value: 'tone' }, 'tone'),
                React.createElement('option', { value: 'rule' }, 'rule')
              )
            ),
            React.createElement('input', { type: 'file', onChange: (e) => setForm({ ...form, file: e.target.files[0] }) }),
            React.createElement('button', { className: 'primary', onClick: upload, disabled: uploading }, uploading ? '업로드 중...' : '업로드')
          ),
          React.createElement('div', { className: 'card' },
            React.createElement('h3', null, '파일 목록'),
            React.createElement('div', null, status),
            React.createElement('table', null,
              React.createElement('thead', null,
                React.createElement('tr', null,
                  React.createElement('th', null, '파일명'),
                  React.createElement('th', null, 'deck/topic'),
                  React.createElement('th', null, 'priority/type'),
                  React.createElement('th', null, 'status'),
                  React.createElement('th', null, '작업')
                )
              ),
              React.createElement('tbody', null,
                ...files.map((f) => React.createElement('tr', { key: f.id },
                  React.createElement('td', null, f.originalName),
                  React.createElement('td', null,
                    React.createElement('input', { value: f.deck || '', onChange: (e) => f.deck = e.target.value }),
                    React.createElement('input', { value: f.topic || '', onChange: (e) => f.topic = e.target.value, style: { marginTop: '4px' } })
                  ),
                  React.createElement('td', null,
                    React.createElement('select', { value: f.priority || 'optional', onChange: (e) => f.priority = e.target.value },
                      React.createElement('option', { value: 'core' }, 'core'),
                      React.createElement('option', { value: 'support' }, 'support'),
                      React.createElement('option', { value: 'optional' }, 'optional')
                    ),
                    React.createElement('select', { value: f.type || 'guidebook', onChange: (e) => f.type = e.target.value, style: { marginTop: '4px' } },
                      React.createElement('option', { value: 'guidebook' }, 'guidebook'),
                      React.createElement('option', { value: 'interpretation' }, 'interpretation'),
                      React.createElement('option', { value: 'tone' }, 'tone'),
                      React.createElement('option', { value: 'rule' }, 'rule')
                    )
                  ),
                  React.createElement('td', null, f.status),
                  React.createElement('td', null,
                    React.createElement('button', { className: 'primary', onClick: () => updateRow(f) }, '저장'),
                    React.createElement('button', { className: 'danger', onClick: () => removeRow(f.id), style: { marginTop: '4px' } }, '삭제')
                  )
                ))
              )
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
