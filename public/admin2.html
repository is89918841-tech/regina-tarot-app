<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Regina Admin</title>
<style>
body {
  background:#0b1220;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}
.card {
  background:#111827;
  padding:30px;
  border-radius:12px;
  width:320px;
}
input {
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#1f2937;
  border:none;
  color:#fff;
}
button {
  margin-top:10px;
  width:100%;
  padding:10px;
  background:#6366f1;
  border:none;
  color:#fff;
  cursor:pointer;
}
.error {
  margin-top:10px;
  color:#f87171;
}
</style>
</head>

<body>

<div class="card">
  <h2>레지나 관리자</h2>
  <input id="pw" type="password" placeholder="비밀번호 입력">
  <button onclick="login()">로그인</button>
  <div id="error" class="error"></div>
</div>

<script>
function login() {
  const pw = document.getElementById('pw').value;

  if (pw === '1234') {
    document.body.innerHTML = "<h1 style='color:white'>로그인 성공 🎉</h1>";
  } else {
    document.getElementById('error').innerText = "비밀번호 틀림";
  }
}
</script>

</body>
</html>
