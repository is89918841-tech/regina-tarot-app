lass="flex items-center gap-3"><label class="text-sm text-slate-300 w-28">오라클</label><input type="checkbox"></div><div class="flex items-center gap-3"><label class="text-sm text-slate-300 w-28">보조덱</label><input type="checkbox"></div><div class="flex items-center gap-6"><label class="text-sm text-slate-300 w-28">오간기</label><input type="checkbox"><label class="text-sm text-slate-300 w-28 ml-4">오방기</label><input type="checkbox"></div></div></div></section><button class="mt-2 px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded shadow-soft">카드 뽑기</button><div id="result-anchor"></div><div class="mt-4 text-xs text-slate-400">JSON 상태: 로딩 완료 · 타로 37 · 오라클 16 · 주역 64괘 · 주역육효 64괘</div></div></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;

      // -------- helpers --------
      const json = async (url) => {
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`JSON fetch 실패: ${url} (${res.status})`);
        return await res.json();
      };
      function shuffleInPlace(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

      const ORACLE_KEYWORD_FALLBACK = [
        '경계','확장','정화','인내','회복','소통','결단','유연성','균형','휴식','몰입','신뢰','재정비','성장','재시도','축복','배움','경로수정','연결','해방','용기','겸손','보호','변화','기회','통찰','경험','전환','안정','기초','자기돌봄','성찰','협력','해소','도약','선택','실행','기한','리스크관리','타이밍','감사','용서','경계선','열림','집중','휴지기'
      ];

      const CountStepper = React.memo(function CountStepper({ value, setValue, min=1, max=5 }){
        const clamp = (v)=> Math.min(max, Math.max(min, v));
        const dec = ()=> setValue(clamp((parseInt(String(value),10)||min) - 1));
        const inc = ()=> setValue(clamp((parseInt(String(value),10)||min) + 1));
        return (
          <div className="flex items-center gap-2">
            <button type="button" onClick={dec} className="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600">-</button>
            <input type="number" min={min} max={max} value={value}
                   onChange={e=>setValue(clamp(parseInt(e.target.value,10)||min))}
                   className="w-20 bg-slate-900/60 border border-slate-700 rounded-xl p-1 text-center"/>
            <button type="button" onClick={inc} className="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600">+</button>
          </div>
        );
      });

      function App(){
        const MANIFEST_URL = "/data/manifest.json";
        const DECKS_URL   = "/data/decks.json"; // optional alias/extra lists

        // store
        const [tarotMap, setTarotMap] = useState({});
        const [oracleMap, setOracleMap] = useState({});
        const [iching64, setIching64] = useState([]);
        const [loaded, setLoaded] = useState(false);
        const [loadError, setLoadError] = useState("");

        // UI
        const [tarotDeck, setTarotDeck] = useState("");
        const [allowReversal, setAllowReversal] = useState(true);
        const [reverseRatio, setReverseRatio] = useState(50);
        const [cardCount, setCardCount] = useState(1);

        const [mode, setMode] = useState("random");
        const [numMap, setNumMap] = useState([]);
        const [selectedNums, setSelectedNums] = useState([]);

        // Aux toggles + counts
        const [useRunes, setUseRunes] = useState(false);
        const [runeCount, setRuneCount] = useState(2);
        const [useLenormand, setUseLenormand] = useState(false);
        const [lenormandCount, setLenormandCount] = useState(2);
        const [useOgangi, setUseOgangi] = useState(false);
        const [useObanggi, setUseObanggi] = useState(false);
        const [useIching, setUseIching] = useState(false);
        const [ichingCount, setIchingCount] = useState(1);
        const [useOracle, setUseOracle] = useState(false);
        const [oracleDeck, setOracleDeck] = useState("");
        const [oracleCount, setOracleCount] = useState(1);

        // Custom aux decks (e.g., 갑골영패, 귀문방, 주역육효괘 등)
        const [auxDeckMap, setAuxDeckMap] = useState({});
        const [useAuxDeck, setUseAuxDeck] = useState(false);
        const [selectedAuxDecks, setSelectedAuxDecks] = useState([]);
        const [auxDeckCounts, setAuxDeckCounts] = useState({});

        // 주역육효괘 (주역과 별개)
        const [yukyoCards, setYukyoCards] = useState([]);
        const [useYukyo, setUseYukyo] = useState(false);
        const [yukyoCount, setYukyoCount] = useState(1);
const [result, setResult] = useState(null);

        // Load data
        useEffect(()=>{
          (async ()=>{
            try{
              const m = await json(MANIFEST_URL);

              const tarotEntries = await Promise.all(Object.entries(m.tarot||{}).map(async ([name,path])=>{
                const raw = await json(`/data/${path}`);
                // tarot deck json can be array OR object of arrays (e.g., ALICE_MAJOR...)
                let arr = raw;
                if (!Array.isArray(raw) && raw && typeof raw === 'object') {
                  arr = Object.values(raw).flat().filter(Boolean);
                }
                return [name, Array.isArray(arr)? arr : []];
              }));
              let tarotObj = Object.fromEntries(tarotEntries);

              const oracleEntries = await Promise.all(Object.entries(m.oracle||{}).map(async ([name,path])=>{
                const raw = await json(`/data/${path}`);
                // tarot deck json can be array OR object of arrays (e.g., ALICE_MAJOR...)
                let arr = raw;
                if (!Array.isArray(raw) && raw && typeof raw === 'object') {
                  arr = Object.values(raw).flat().filter(Boolean);
                }
                return [name, Array.isArray(arr)? arr : []];
              }));
              let oracleObj = Object.fromEntries(oracleEntries);

              // aux decks from manifest (보조덱)
              const auxEntries = await Promise.all(Object.entries(m.aux||{}).map(async ([name,path])=>{
                const raw = await json(`/data/${path}`);
                // some aux decks may be objects: map to readable strings
                let arr = raw;
                if (Array.isArray(raw) && raw.length && typeof raw[0] === 'object') {
                  arr = raw.map(o=> {
                    const h = o?.hanzi ?? o?.괘명 ?? o?.name ?? '';
                    const k = o?.ko ?? o?.한글 ?? o?.meaning ?? '';
                    const extra = o?.의미 ?? '';
                    const tail = [k, extra].filter(Boolean).join(' / ');
                    return tail ? `${h} (${tail})` : String(h||'');
                  }).filter(Boolean);
                } else if (!Array.isArray(raw) && raw && typeof raw === 'object') {
                  arr = Object.values(raw).flat().filter(Boolean);
                }
                return [name, Array.isArray(arr)? arr : []];
              }));
              const auxObj = Object.fromEntries(auxEntries);

              if (m.iching) setIching64(await json(`/data/${m.iching}`));
              if (m.yukyo) {
                const y = await json(`/data/${m.yukyo}`);
                setYukyoCards(Array.isArray(y) ? y : (y.cards || []));
              }

              // optional decks.json merge (alias + extra oracles)
              try {
                const d = await json(DECKS_URL);
                // alias_of UNIVERSAL_78
                let universal78 = null;
                try { universal78 = await json("/data/universal.json"); } catch {}
                if (d.tarot_decks && universal78){
                  for(const [name, cfg] of Object.entries(d.tarot_decks)){
                    if (cfg && cfg.alias_of === "UNIVERSAL_78" && Array.isArray(universal78) && universal78.length){
                      tarotObj[name] = [...universal78];
                    }
                  }
                }
                // custom oracle lists
                if (d.oracle_decks){
                  for(const [name, cfg] of Object.entries(d.oracle_decks)){
                    if (cfg && Array.isArray(cfg.cards) && cfg.cards.length>0){
                      oracleObj[name] = cfg.cards;
                    } else if (!oracleObj[name]) {
                      oracleObj[name] = []; // register empty: fallback keywords used at draw
                    }
                  }
                }
              } catch (_) {}

              setTarotMap(tarotObj);
              setOracleMap(oracleObj);
              setAuxDeckMap(auxObj);
              setTarotDeck(Object.keys(tarotObj)[0] || "");
              setOracleDeck(Object.keys(oracleObj)[0] || "");
              setSelectedAuxDecks([]);
              setAuxDeckCounts({});
              setLoaded(true);
            }catch(err){ setLoadError(String(err?.message||err)); }
          })();
        }, []);

        // numbers map sync
        useEffect(()=>{
          if(mode==='numbers' && tarotDeck && tarotMap[tarotDeck]){
            const cards = tarotMap[tarotDeck];
            if(numMap.length!==cards.length || !numMap.every(x=>cards.includes(x))){
              setNumMap(shuffleInPlace([...cards]));
              setSelectedNums([]);
            }
          }
        }, [mode, tarotDeck, tarotMap]);

        // hotkeys (1..13)
        useEffect(()=>{
          const onKey = (e)=>{
            const tag = e.target?.tagName?.toUpperCase?.() || "";
            if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target?.isContentEditable) return;
            if (e.key>='1' && e.key<='9') setCardCount(parseInt(e.key,10));
            else if (e.key==='0') setCardCount(10);
            else if (e.key==='-') setCardCount(11);
            else if (e.key==='=') setCardCount(12);
            else if ((e.key||'').toLowerCase()==='q') setCardCount(13);
          };
          window.addEventListener('keydown', onKey);
          return ()=>window.removeEventListener('keydown', onKey);
        }, []);

        const ALL_TAROT_DECKS = useMemo(()=> Object.keys(tarotMap), [tarotMap]);
        const ORACLE_DECKS = useMemo(()=> Object.keys(oracleMap), [oracleMap]);
        const AUX_DECKS = useMemo(()=> Object.keys(auxDeckMap), [auxDeckMap]);

        const RUNES_24 = ["Fehu","Uruz","Thurisaz","Ansuz","Raidho","Kenaz","Gebo","Wunjo","Hagalaz","Nauthiz","Isa","Jera","Eihwaz","Perthro","Algiz","Sowilo","Tiwaz","Berkano","Ehwaz","Mannaz","Laguz","Ingwaz","Othala","Dagaz"];
        const LENORMAND_36 = [
          "1 라이더","2 클로버","3 배","4 집","5 나무","6 구름","7 뱀","8 관","9 꽃다발",
          "10 낫","11 채찍","12 새","13 아이","14 여우","15 곰","16 별","17 황새","18 개",
          "19 탑","20 정원","21 산","22 갈림길","23 쥐","24 하트","25 반지","26 책",
          "27 편지","28 남자","29 여자","30 백합","31 태양","32 달","33 열쇠","34 물고기",
          "35 닻","36 십자가"
        ];
        const OGANGI_5 = ["목(木)","화(火)","토(土)","금(金)","수(水)"];
        const OBANGGI_5 = ["동","서","남","북","중앙"];

        const drawRandomTarot = (cards, count, allowRev, ratio)=>{
          const deck = shuffleInPlace([...cards]);
          return deck.slice(0, count).map(name => ({ name, reversed: !!allowRev && Math.random()*100 < ratio }));
        };
        const drawRunes = (n)=> shuffleInPlace([...RUNES_24]).slice(0,n);
        const drawLenormand = (n)=> shuffleInPlace([...LENORMAND_36]).slice(0,n);
        const drawOgangi = ()=> shuffleInPlace([...OGANGI_5])[0];
        const drawObanggi = ()=> shuffleInPlace([...OBANGGI_5])[0];
        const drawIching = (n)=> shuffleInPlace([...iching64]).slice(0,n);

        const formatYukyoCard = (c)=>{
          if (!c) return "";
          if (typeof c === "string") return c.trim();
          const title = c.title || c.name || "";
          const name = c.괘명 || title || "";
          const kor = c.한글 ? `(${c.한글})` : "";
          const meaning = c.의미 ? ` — ${c.의미}` : "";
          const up = c.상괘 ? ` — 상:${c.상괘}` : "";
          const low = c.하괘 ? ` 하:${c.하괘}` : "";
          return `${name}${kor}${meaning}${up}${low}`.trim();
        };

        const drawYukyoMany = (n)=>{
          if (!yukyoCards || yukyoCards.length===0) return [];
          const picks = shuffleInPlace([...yukyoCards]).slice(0, n).map(formatYukyoCard).filter(Boolean);

          if (picks.length===0) return [];

          if (n===13 && picks.length===13){
            const out = [];
            out.push(`주역육효괘(총운): ${picks[0]}`);
            const months = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
            for (let i=0;i<12;i++){
              out.push(`주역육효괘(${months[i]}): ${picks[i+1]}`);
            }
            return out;
          }

          if (picks.length===1) return [`주역육효괘: ${picks[0]}`];

          const labels = ["본괘","조언","결과"];
          return picks.map((p, idx)=>`주역육효괘(${labels[idx] || (idx+1)}): ${p}`);
        };

        // toggle number for numbers mode
        const toggleNum = (n)=>{
          setSelectedNums(prev=>{
            const has = prev.includes(n);
            if (has) return prev.filter(x=>x!==n);
            if (prev.length < cardCount) return [...prev, n];
            return prev;
          });
        };

        const drawTarot = ()=>{
          const cards = tarotMap[tarotDeck] || [];
          if(!cards.length){ alert("선택된 타로 덱 데이터가 비어 있어요."); return null; }
          let picked = [];
          if (mode==='random') picked = drawRandomTarot(cards, cardCount, allowReversal, reverseRatio);
          else {
            if (selectedNums.length !== cardCount){ alert(`숫자 모드: ${cardCount}장 필요 (현재 ${selectedNums.length}장)`); return null; }
            picked = selectedNums.map(n=>({ name: (numMap[n-1]||cards[n-1]||""), reversed: !!allowReversal && Math.random()*100 < reverseRatio }));
          }
          return picked.map((o,idx)=>({ position:`카드 ${idx+1}`, card: o.name + (o.reversed?" (역방향)":"") }));
        };

        
        const toggleAuxDeck = (name)=>{
          setSelectedAuxDecks(prev=>{
            const has = prev.includes(name);
            const next = has ? prev.filter(x=>x!==name) : [...prev, name];
            return next;
          });
          setAuxDeckCounts(prev=>{
            // keep existing count, default 1 when first added
            if (prev && Object.prototype.hasOwnProperty.call(prev, name)) return prev;
            return { ...(prev||{}), [name]: 1 };
          });
        };

const drawSelectedAuxDecks = ()=>{
          const out = [];
          for (const deckName of selectedAuxDecks){
            const list = auxDeckMap[deckName] || [];
            const cnt = Math.min(13, Math.max(1, (auxDeckCounts?.[deckName] || 1)));
            const picks = shuffleInPlace([...list]).slice(0, Math.min(cnt, list.length || cnt));
            for (const k of picks){
                            if (String(deckName).includes('귀문방')) {
                const dir = (Math.random() < 0.5) ? '정방향' : '역방향';
                out.push(`${deckName}: ${k} (${dir})`);
              } else {
                out.push(`${deckName}: ${k}`);
              }
            }
          }
          return out;
        };

        const drawOracles = (n)=>{
          const list = oracleMap[oracleDeck];
          let cards = Array.isArray(list) ? list : [];
          if (!cards.length) cards = ORACLE_KEYWORD_FALLBACK;
          const picks = shuffleInPlace([...cards]).slice(0,n);
          return picks.map(k=>`${oracleDeck}: ${k}`);
        };

        const onDraw = ()=>{
          const tarot = drawTarot(); if(!tarot) return;
          const runes = useRunes ? drawRunes(runeCount) : [];
          const oracles = useOracle ? drawOracles(oracleCount) : [];
          const lenormand = useLenormand ? drawLenormand(lenormandCount) : [];
          const iching = useIching ? drawIching(ichingCount) : [];
          const aux = [];
          if (useOgangi) aux.push(`오간기: ${drawOgangi()}`);
          if (useObanggi) aux.push(`오방기: ${drawObanggi()}`);
          if (useAuxDeck) aux.push(...drawSelectedAuxDecks());
          if (useYukyo) {
            aux.push(...drawYukyoMany(yukyoCount));
          }
          const r = { tarotDeck, cardCount, tarot, runes, oracles, lenormand, iching, aux };
          setResult(r);
          try{ document.getElementById('result-anchor')?.scrollIntoView({ behavior:'smooth', block:'start' }); }catch{}
        };

        // 결과 복사 - 진짜 개행 문자로 구성
        const templateText = (r)=>{
          if (!r) return "";
          const positions = r.tarot.map(t=>`- ${t.position}: ${t.card}`).join('\n');
          const lines = [
            `**덱**: ${r.tarotDeck}`,
            `**장수**: ${r.cardCount}`,
            '',
            '**포지션별 드로우**',
            positions
          ];
          if (r.runes?.length)     lines.push(`**룬**: ${r.runes.join(', ')}`);
          if (r.oracles?.length)   lines.push(`**오라클**: ${r.oracles.map(s=> s.includes(': ')? s.split(': ').slice(1).join(': ') : s).join(', ')}`);
          if (r.lenormand?.length) lines.push(`**레노먼드**: ${r.lenormand.join(', ')}`);
          if (r.iching?.length)    lines.push(`**주역**: ${r.iching.join(', ')}`);
          if (r.aux?.length)       lines.push(`**보조**: ${r.aux.join(', ')}`);
          return lines.join('\n');
        };

        const handleCopy = async ()=>{
          const txt = templateText(result);
          if (!txt){ alert("먼저 카드를 뽑아주세요."); return; }
          try { await navigator.clipboard.writeText(txt); alert("복사 완료!"); return; } catch {}
          try {
            const ta = document.createElement('textarea');
            ta.style.position='fixed'; ta.style.top='-1000px'; ta.style.opacity='0';
            ta.value = txt; document.body.appendChild(ta); ta.focus(); ta.select();
            document.execCommand && document.execCommand('copy'); document.body.removeChild(ta);
            alert('텍스트를 선택해 복사했어요.');
          } catch { alert('클립보드 권한 문제로 자동 복사 실패.'); }
        };

        return (
          <div className="max-w-5xl mx-auto">
            <header className="mb-6">
              <h1 className="text-2xl md:text-3xl font-bold tracking-tight">레지나 리딩 보조앱 <span className="text-indigo-300">(β)</span></h1>
              <p className="text-slate-300 mt-1">JSON · 장수(1~13) · 랜덤/숫자 · 룬/레노먼드/오간기/오방기/주역/오라클 + 결과 복사</p>
              {!loaded && !loadError && <p className="text-xs text-slate-400 mt-1">데이터 로딩 중…</p>}
              {loadError && <p className="text-xs text-rose-300 mt-1">{loadError}</p>}
            </header>

            <section className="grid grid-cols-1 mb-6">
              <div className="bg-slate-800/60 rounded-2xl p-6 border border-slate-700 shadow-soft">
                <div className="mb-3">
                  <label className="text-sm text-slate-300">드로우 모드</label>
                  <div className="flex gap-2 mt-1">
                    <button onClick={()=>setMode('random')} className={mode==='random'?"bg-indigo-600 px-3 py-1 rounded":"bg-slate-700 px-3 py-1 rounded"}>랜덤</button>
                    <button onClick={()=>setMode('numbers')} className={mode==='numbers'?"bg-indigo-600 px-3 py-1 rounded":"bg-slate-700 px-3 py-1 rounded"}>숫자 뽑기</button>
                    {mode==='numbers' && <button onClick={()=>{ const cards=tarotMap[tarotDeck]||[]; setNumMap(shuffleInPlace([...cards])); setSelectedNums([]); }} className="ml-2 bg-slate-700 px-3 py-1 rounded">맵 다시 섞기</button>}
                  </div>
                </div>

                {mode==='numbers' && (
                  <div className="space-y-2 mb-3">
                    <span className="text-xs text-slate-400">선택 {selectedNums.length}/{cardCount}</span>
                    <div className="grid grid-cols-9 gap-1 max-h-48 overflow-auto p-1 rounded bg-slate-900/40 border border-slate-700">
                      {Array.from({length:(tarotMap[tarotDeck]?.length||78)},(_,i)=>i+1).map(n=>(
                        <button key={n} type="button"
                          title={numMap[n-1] || ""}
                          disabled={!selectedNums.includes(n) && selectedNums.length>=cardCount}
                          onClick={()=>toggleNum(n)}
                          className={"text-xs py-1 rounded-lg border select-none " + (selectedNums.includes(n) ? "bg-indigo-600 border-indigo-500 text-white" : "bg-slate-800/70 border-slate-700 hover:bg-slate-700")}>
                          {n}
                        </button>
                      ))}
                    </div>
                    <div className="text-xs text-slate-500">숫자에 마우스를 올리면 해당 카드명이 툴팁으로 보여요.</div>
                  </div>
                )}

                <label className="text-sm text-slate-300 mt-3 block">메인 타로 덱</label>
                <select value={tarotDeck} onChange={e=>{ setTarotDeck(e.target.value); setSelectedNums([]); }} className="w-full mt-1 bg-slate-900/60 border border-slate-700 rounded-xl p-2">
                  {ALL_TAROT_DECKS.map(name=> (<option key={name} value={name}>{name}</option>))}
                </select>

                <div className="mt-3 flex items-center gap-3">
                  <label className="text-sm text-slate-300">역방향 허용</label>
                  <input type="checkbox" checked={allowReversal} onChange={e=>setAllowReversal(e.target.checked)}/>
                  <input type="range" min={0} max={100} value={reverseRatio} onChange={e=>setReverseRatio(parseInt(e.target.value,10))} className="flex-1"/>
                  <span className="text-xs w-10 text-right">{reverseRatio}%</span>
                </div>

                <div className="mt-3 flex items-center gap-3">
                  <span className="text-sm text-slate-300">장수</span>
                  <CountStepper value={cardCount} setValue={(v)=>setCardCount(Math.min(13, Math.max(1, v)))} min={1} max={13} />
                  <span className="text-xs text-slate-400">(키보드 1~9, 0=10, -=11, =(+)=12, Q=13)</span>
                </div>

                <div className="mt-4 space-y-3">
                  <div className="flex items-center gap-3">
                    <label className="text-sm text-slate-300 w-28">룬스톤</label>
                    <input type="checkbox" checked={useRunes} onChange={e=>setUseRunes(e.target.checked)} />
                    {useRunes && (<CountStepper value={runeCount} setValue={(v)=>setRuneCount(Math.min(6, Math.max(1, v)))} min={1} max={6} />)}
                  </div>
                  <div className="flex items-center gap-3">
                    <label className="text-sm text-slate-300 w-28">레노먼드</label>
                    <input type="checkbox" checked={useLenormand} onChange={e=>setUseLenormand(e.target.checked)} />
                    {useLenormand && (<CountStepper value={lenormandCount} setValue={(v)=>setLenormandCount(Math.min(5, Math.max(1, v)))} min={1} max={5} />)}
                  </div>
                  <div className="flex items-center gap-3">
                    <label className="text-sm text-slate-300 w-28">주역(I Ching)</label>
                    <input type="checkbox" checked={useIching} onChange={e=>setUseIching(e.target.checked)} />
                    {useIching && (<CountStepper value={ichingCount} setValue={(v)=>setIchingCount(Math.min(3, Math.max(1, v)))} min={1} max={3} />)}
                  </div>
                  <div className="flex items-center gap-3">
                    <label className="text-sm text-slate-300 w-28">주역육효괘</label>
                    <input type="checkbox" checked={useYukyo} onChange={e=>setUseYukyo(e.target.checked)} />
                    <span className="text-xs text-slate-500">주역과 별개로 64괘(상/하괘)로 뽑아요</span>
                    {useYukyo && (
                      <div className="flex items-center gap-2 ml-2">
                        <CountStepper value={yukyoCount} setValue={(v)=>setYukyoCount(Math.min(13, Math.max(1, v)))} min={1} max={13} />
                        <button className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs" onClick={()=>setYukyoCount(1)}>1</button>
                        <button className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs" onClick={()=>setYukyoCount(3)}>3</button>
                        <button className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs" onClick={()=>setYukyoCount(13)}>13(신년)</button>
                      </div>
                    )}
                  </div>
                  <div className="flex items-center gap-3">
                    <label className="text-sm text-slate-300 w-28">오라클</label>
                    <input type="checkbox" checked={useOracle} onChange={e=>setUseOracle(e.target.checked)} />
                    {useOracle && (
                      <div className="flex items-center gap-2">
                        <select value={oracleDeck} onChange={e=>setOracleDeck(e.target.value)} className="bg-slate-900/60 border border-slate-700 rounded p-2">
                          {ORACLE_DECKS.map(n=>(<option key={n} value={n}>{n}</option>))}
                        </select>
                        <CountStepper value={oracleCount} setValue={(v)=>setOracleCount(Math.min(13, Math.max(1, v)))} min={1} max={13} />
                      </div>
                    )}
                  </div>
                  <div className="flex items-center gap-3">
                    <label className="text-sm text-slate-300 w-28">보조덱</label>
                    <input type="checkbox" checked={useAuxDeck} onChange={e=>setUseAuxDeck(e.target.checked)} />
                    {useAuxDeck && (
                      <div className="flex flex-col gap-2">
                        <div className="text-xs text-slate-500">여러 보조덱을 동시에 선택해서 각각 따로 뽑을 수 있어요.</div>
                        <div className="flex flex-col gap-2">
                          {AUX_DECKS.map(name=>{
                            const checked = selectedAuxDecks.includes(name);
                            return (
                              <div key={name} className="flex items-center gap-2">
                                <input type="checkbox" checked={checked} onChange={()=>toggleAuxDeck(name)} />
                                <span className="text-sm">{name}</span>
                                {checked && (
                                  <CountStepper
                                    value={auxDeckCounts?.[name] || 1}
                                    setValue={(v)=>setAuxDeckCounts(prev=>({...prev, [name]: Math.min(13, Math.max(1, v))}))}
                                    min={1}
                                    max={13}
                                  />
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="flex items-center gap-6">
                    <label className="text-sm text-slate-300 w-28">오간기</label>
                    <input type="checkbox" checked={useOgangi} onChange={e=>setUseOgangi(e.target.checked)} />
                    <label className="text-sm text-slate-300 w-28 ml-4">오방기</label>
                    <input type="checkbox" checked={useObanggi} onChange={e=>setUseObanggi(e.target.checked)} />
                  </div>
                </div>
              </div>
            </section>

            <button onClick={onDraw} className="mt-2 px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded shadow-soft">카드 뽑기</button>

            <div id="result-anchor"></div>

            {result && (
              <div className="mt-4 space-y-4">
                <div className="bg-slate-800/60 rounded-2xl p-4 border border-slate-700 shadow">
                  <div className="mb-2 flex items-center justify-between">
                    <div><b>덱:</b> {result.tarotDeck} | <b>장수:</b> {result.cardCount}</div>
                    <button onClick={handleCopy} className="px-3 py-1.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm">결과 복사</button>
                  </div>

                  <div className="mt-1">
                    <b>타로:</b>
                    <div className="mt-2 space-y-1">
                      {result.tarot.map((t,idx)=>(<div key={idx}>{t.position}: {t.card}</div>))}
                    </div>
                  </div>

                  {result.lenormand?.length>0 && (
                    <div className="mt-3">
                      <b>레노먼드:</b>
                      <div className="mt-2 flex flex-wrap gap-2">
                        {result.lenormand.map((c,i)=>(<span key={i} className="chip">{c}</span>))}
                      </div>
                    </div>
                  )}

                  {result.runes?.length>0 && (
                    <div className="mt-3"><b>룬:</b> {result.runes.join(', ')}</div>
                  )}

                  {result.iching?.length>0 && (
                    <div className="mt-3"><b>주역:</b> {result.iching.join(', ')}</div>
                  )}

                  {result.oracles?.length>0 && (
                    <div className="mt-3">
                      <b>오라클:</b> {result.oracles.map((s)=> s.includes(': ')? s.split(': ').slice(1).join(': '): s).join(', ')}
                    </div>
                  )}

                  {result.aux?.length>0 && (
                    <div className="mt-3"><b>보조:</b> {result.aux.join(', ')}</div>
                  )}
                </div>
              </div>
            )}

            <div className="mt-4 text-xs text-slate-400">
              JSON 상태: {loaded? '로딩 완료' : (loadError? '오류' : '로딩 중')} {loaded && <>· 타로 {Object.keys(tarotMap).length} · 오라클 {Object.keys(oracleMap).length} · 주역 {iching64.length}괘 · 주역육효 {yukyoCards.length}괘</>}
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  

</body></html>
