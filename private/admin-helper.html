<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Regina Admin Helper</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e222b;
      --line: #2c3340;
      --text: #eef2f7;
      --muted: #a8b1c1;
      --accent: #c8a96b;
      --accent-strong: #e2c387;
      --danger: #ff7b7b;
      --ok: #7bd88f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, #0c0e13 0%, #12161d 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    .topbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .title-box h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .title-box p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 16px;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: rgba(23, 26, 33, 0.96);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 18px;
      letter-spacing: -0.01em;
    }

    .section {
      margin-top: 16px;
    }

    .section:first-child {
      margin-top: 0;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200, 169, 107, 0.12);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 640px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .04s ease, opacity .18s ease, background .18s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--accent-strong) 0%, var(--accent) 100%);
      color: #1c160c;
    }

    .btn-secondary {
      background: #2a3140;
      color: var(--text);
      border: 1px solid #394253;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .btn-danger {
      background: #3a1e23;
      color: #ffc7c7;
      border: 1px solid #5b2d35;
    }

    .mini-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #151922;
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .status.ok {
      border-color: rgba(123, 216, 143, 0.25);
      color: #c8f2d0;
    }

    .status.error {
      border-color: rgba(255, 123, 123, 0.25);
      color: #ffd1d1;
    }

    .status.warn {
      border-color: rgba(245,158,11,0.25);
      color: #fde68a;
    }

    .block-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .block-title strong {
      font-size: 15px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      background: rgba(200,169,107,.1);
      border: 1px solid rgba(200,169,107,.22);
      color: #ecd8ae;
      font-size: 12px;
      padding: 6px 10px;
    }

    .readonly-box {
      background: #11151d;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      min-height: 120px;
    }

    .readonly-box.small {
      min-height: 90px;
    }

    .preview {
      min-height: 140px;
    }

    .out {
      min-height: 220px;
    }

    .footer-note {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .meta-box {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 12px 14px;
      background: #121722;
      border: 1px solid var(--line);
      border-radius: 14px;
      font-size: 13px;
    }

    .meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
    }

    .meta-line strong {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title-box">
        <h1>레지나 관리자 보조앱</h1>
        <p>상담건 자동 불러오기 → 추천 → 드로우 → 최종 리딩 → 저장 → 카톡 복사/열기까지 한 화면에서 처리</p>
      </div>

      <div class="top-actions">
        <button class="btn-secondary" id="checkAuthBtn" type="button">관리자 인증 확인</button>
        <button class="btn-danger" id="logoutBtn" type="button">로그아웃</button>
      </div>
    </div>

    <div class="grid">
      <section class="panel">
        <h2>입력</h2>

        <div class="section row">
          <div>
            <label class="label" for="consultationId">상담 ID</label>
            <input id="consultationId" type="text" placeholder="예: CONS-20260421-123456" />
          </div>

          <div>
            <label class="label" for="customerName">이름 메모</label>
            <input id="customerName" type="text" placeholder="예: 김OO" />
          </div>
        </div>

        <div class="section">
          <label class="label" for="question">질문</label>
          <textarea id="question" placeholder="질문이 자동으로 들어오거나 직접 입력할 수 있어요."></textarea>
        </div>

        <div class="section row">
          <div>
            <label class="label" for="productKind">상품 종류</label>
            <select id="productKind">
              <option value="simple">simple (간단형)</option>
              <option value="standard" selected>standard (기본형)</option>
              <option value="booking">booking (예약형)</option>
            </select>
          </div>

          <div>
            <label class="label" for="productName">상품명 메모</label>
            <input id="productName" type="text" placeholder="예: 7천원 핵심 리딩" />
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-primary" id="loadConsultationBtn" type="button">상담건 불러오기</button>
          <button class="btn-primary" id="runAllBtn" type="button">전체 자동 실행 + 저장</button>
          <button class="btn-secondary" id="recommendBtn" type="button">추천 생성 + 저장</button>
          <button class="btn-secondary" id="drawBtn" type="button">드로우 생성 + 저장</button>
          <button class="btn-secondary" id="readingBtn" type="button">최종 리딩 생성 + 저장</button>
          <button class="btn-ghost" id="clearBtn" type="button">초기화</button>
        </div>

        <div class="hint">
          상담 ID가 있으면 해당 상담건을 자동 조회하고,<br>
          추천 / 드로우 / 최종 리딩 결과를 해당 상담건에 다시 저장합니다.
        </div>

        <div id="consultationMeta" class="meta-box" style="display:none;"></div>
        <div id="statusBox" class="status">대기 중</div>
      </section>

      <section class="panel">
        <div>
          <div class="block-title">
            <strong>추천 결과</strong>
            <div class="mini-actions">
              <button class="btn-ghost" id="copyRecommendBtn" type="button">복사</button>
            </div>
          </div>
          <div id="recommendPreview" class="readonly-box small">아직 없음</div>
          <div id="recommendChips" class="chip-row"></div>
        </div>

        <div class="section">
          <div class="block-title">
            <strong>드로우 결과</strong>
            <div class="mini-actions">
              <button class="btn-ghost" id="copyDrawBtn" type="button">복사</button>
            </div>
          </div>
          <div id="drawPreview" class="readonly-box preview">아직 없음</div>
        </div>

        <div class="section">
          <div class="block-title">
            <strong>최종 리딩</strong>
            <div class="mini-actions">
              <button class="btn-ghost" id="copyReadingBtn" type="button">복사</button>
            </div>
          </div>
          <div id="readingPreview" class="readonly-box out">아직 없음</div>
        </div>

        <div class="section">
          <div class="block-title">
            <strong>카톡 전달 문구</strong>
            <div class="mini-actions">
              <button class="btn-ghost" id="copyKakaoBtn" type="button">복사</button>
              <button class="btn-secondary" id="openKakaoBtn" type="button">카카오 채널 열기</button>
            </div>
          </div>
          <div id="kakaoPreview" class="readonly-box out">아직 없음</div>
        </div>
      </section>
    </div>

    <div class="footer-note">
      사용 예시: <code>/admin/helper?id=CONS-20260421-123456&autorun=1</code><br>
      자동 실행 시 카톡 문구는 복사되고, 카카오 채널 창이 새 탭으로 열립니다.
    </div>
  </div>

  <script>
    const KAKAO_CHANNEL_URL = 'http://pf.kakao.com/_xamZxfn/chat';

    const $ = (id) => document.getElementById(id);

    const els = {
      consultationId: $('consultationId'),
      customerName: $('customerName'),
      question: $('question'),
      productKind: $('productKind'),
      productName: $('productName'),

      consultationMeta: $('consultationMeta'),
      statusBox: $('statusBox'),

      recommendPreview: $('recommendPreview'),
      recommendChips: $('recommendChips'),
      drawPreview: $('drawPreview'),
      readingPreview: $('readingPreview'),
      kakaoPreview: $('kakaoPreview'),

      loadConsultationBtn: $('loadConsultationBtn'),
      runAllBtn: $('runAllBtn'),
      recommendBtn: $('recommendBtn'),
      drawBtn: $('drawBtn'),
      readingBtn: $('readingBtn'),
      clearBtn: $('clearBtn'),

      copyRecommendBtn: $('copyRecommendBtn'),
      copyDrawBtn: $('copyDrawBtn'),
      copyReadingBtn: $('copyReadingBtn'),
      copyKakaoBtn: $('copyKakaoBtn'),
      openKakaoBtn: $('openKakaoBtn'),

      checkAuthBtn: $('checkAuthBtn'),
      logoutBtn: $('logoutBtn'),
    };

    let state = {
      consultation: null,
      recommendText: '',
      recommendConfig: null,
      drawResult: '',
      finalReading: '',
      kakaoText: '',
    };

    function setStatus(text, type = '') {
      els.statusBox.className = `status ${type}`.trim();
      els.statusBox.textContent = text;
    }

    function getConsultationId() {
      return (els.consultationId.value || '').trim();
    }

    function getQuestion() {
      return (els.question.value || '').trim();
    }

    function getProductKind() {
      return els.productKind.value || 'standard';
    }

    function renderMeta(item) {
      if (!item) {
        els.consultationMeta.style.display = 'none';
        els.consultationMeta.innerHTML = '';
        return;
      }

      els.consultationMeta.style.display = 'grid';
      els.consultationMeta.innerHTML = `
        <div class="meta-line"><strong>ID</strong> ${escapeHtml(item.id || '-')}</div>
        <div class="meta-line"><strong>이름</strong> ${escapeHtml(item.name || '-')}</div>
        <div class="meta-line"><strong>연락처</strong> ${escapeHtml(item.contact || '-')}</div>
        <div class="meta-line"><strong>상품</strong> ${escapeHtml(item.product_name || '-')} / ${escapeHtml(String(item.product_price || '-'))}</div>
        <div class="meta-line"><strong>상태</strong> ${escapeHtml(item.status || '-')}</div>
      `;
    }

    function renderRecommend(text, config) {
      els.recommendPreview.textContent = text || '아직 없음';
      els.recommendChips.innerHTML = '';

      if (!config) return;

      const chips = [];
      if (config.deck) chips.push(`<span class="chip">덱: ${escapeHtml(config.deck)}</span>`);
      if (config.spread) chips.push(`<span class="chip">스프레드: ${escapeHtml(config.spread)}</span>`);
      (config.positions || []).forEach((p) => {
        chips.push(`<span class="chip">포지션: ${escapeHtml(p)}</span>`);
      });
      (config.extras || []).forEach((e) => {
        chips.push(`<span class="chip">보조: ${escapeHtml(e)}</span>`);
      });

      els.recommendChips.innerHTML = chips.join('');
    }

    function renderDraw(drawText) {
      els.drawPreview.textContent = drawText || '아직 없음';
    }

    function renderReading(reading) {
      els.readingPreview.textContent = reading || '아직 없음';
    }

    function renderKakao(text) {
      els.kakaoPreview.textContent = text || '아직 없음';
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function postJson(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(body || {})
      });

      let data = null;
      try {
        data = await res.json();
      } catch {
        data = null;
      }

      if (!res.ok) {
        const msg = data?.error || `${url} 호출 실패 (${res.status})`;
        throw new Error(msg);
      }

      return data;
    }

    async function getJson(url) {
      const res = await fetch(url, {
        method: 'GET',
        credentials: 'include'
      });

      let data = null;
      try {
        data = await res.json();
      } catch {
        data = null;
      }

      if (!res.ok) {
        const msg = data?.error || `${url} 조회 실패 (${res.status})`;
        throw new Error(msg);
      }

      return data;
    }

    function extractRecommendTextFromConfig(config) {
      if (!config) return '';
      return [
        `추천 덱: ${config.deck || '-'}`,
        `추천 스프레드: ${config.spread || '-'}`,
        `포지션: ${(config.positions || []).join(', ') || '-'}`,
        `보조도구: ${(config.extras || []).join(', ') || '없음'}`
      ].join('\n');
    }

    function buildKakaoText() {
      const name = (els.customerName.value || '내담자님').trim();
      const text = [
        `${name}님 안녕하세요.`,
        '',
        '요청주신 리딩 결과 전달드려요.',
        '',
        state.finalReading || '',
        '',
        '추가 질문이 있으시면 이어서 남겨주세요.'
      ].join('\n');

      state.kakaoText = text;
      renderKakao(text);
      return text;
    }

    async function copyToClipboard(text) {
      if (!text || text === '아직 없음') {
        throw new Error('복사할 내용이 없어요.');
      }
      await navigator.clipboard.writeText(text);
    }

    function openKakaoChannel() {
      window.open(KAKAO_CHANNEL_URL, '_blank', 'noopener,noreferrer');
    }

    async function loadConsultation() {
      const id = getConsultationId();
      if (!id) throw new Error('상담 ID가 필요해요.');

      setStatus('상담건 불러오는 중...');
      const data = await getJson(`/api/admin/consultations/${encodeURIComponent(id)}`);
      const item = data.consultation;

      state.consultation = item;
      els.question.value = item.question || '';
      els.customerName.value = item.name || '';
      els.productKind.value = item.product_kind || 'standard';
      els.productName.value = item.product_name || '';

      state.recommendText = item.recommendation || '';
      state.drawResult = item.drawResult || item.draw_result || '';
      state.finalReading = item.finalReading || item.final_reading || '';
      state.kakaoText = item.kakaoText || item.kakao_text || '';

      renderMeta(item);
      renderRecommend(state.recommendText, null);
      renderDraw(state.drawResult);
      renderReading(state.finalReading);
      renderKakao(state.kakaoText);

      setStatus('상담건 불러오기 완료', 'ok');
      return item;
    }

    async function runRecommendAndSave() {
      const question = getQuestion();
      const productKind = getProductKind();
      const id = getConsultationId();

      if (!question) throw new Error('질문을 먼저 입력해주세요.');

      setStatus('추천 생성 중...');
      const data = await postJson('/api/recommend', { question, productKind });

      state.recommendConfig = data.config || null;
      state.recommendText = extractRecommendTextFromConfig(state.recommendConfig);
      renderRecommend(state.recommendText, state.recommendConfig);

      if (id) {
        await postJson(`/api/admin/consultations/${encodeURIComponent(id)}/recommendation`, {
          recommendation: state.recommendText
        });
      }

      setStatus(id ? '추천 생성 및 저장 완료' : '추천 생성 완료', 'ok');
      return state.recommendText;
    }

    async function runDrawAndSave() {
      const question = getQuestion();
      const productKind = getProductKind();
      const id = getConsultationId();

      if (!question) throw new Error('질문을 먼저 입력해주세요.');

      setStatus('드로우 생성 중...');
      const data = await postJson('/api/draw', { question, productKind });

      state.drawResult = data.drawResult || '';
      renderDraw(state.drawResult);

      if (data.setup) {
        state.recommendConfig = {
          deck: data.setup.deck,
          spread: data.setup.spread,
          count: (data.setup.positions || []).length,
          positions: data.setup.positions || [],
          extras: data.setup.auxTools || []
        };
        if (!state.recommendText) {
          state.recommendText = extractRecommendTextFromConfig(state.recommendConfig);
        }
        renderRecommend(state.recommendText, state.recommendConfig);
      }

      if (id) {
        await postJson(`/api/admin/consultations/${encodeURIComponent(id)}/draw`, {
          drawResult: state.drawResult
        });
      }

      setStatus(id ? '드로우 생성 및 저장 완료' : '드로우 생성 완료', 'ok');
      return state.drawResult;
    }

    async function runReadingAndSave() {
      const question = getQuestion();
      const id = getConsultationId();

      if (!question) throw new Error('질문을 먼저 입력해주세요.');
      if (!state.drawResult) throw new Error('먼저 드로우를 생성해주세요.');

      setStatus('최종 리딩 생성 중...');

      const data = await postJson('/api/reading', {
        question,
        cards: state.drawResult
      });

      state.finalReading = data.reading || data.finalReading || '';
      renderReading(state.finalReading);

      if (id) {
        await postJson(`/api/admin/consultations/${encodeURIComponent(id)}/reading`, {
          finalReading: state.finalReading
        });
      }

      setStatus(id ? '최종 리딩 생성 및 저장 완료' : '최종 리딩 생성 완료', 'ok');
      return state.finalReading;
    }

    async function runAll() {
      const question = getQuestion();
      if (!question) throw new Error('질문을 먼저 입력해주세요.');

      const id = getConsultationId();
      const name = (els.customerName.value || '내담자님').trim();

      setStatus(`${name} 건 전체 자동 실행 중...`, 'warn');

      await runRecommendAndSave();
      await runDrawAndSave();
      await runReadingAndSave();

      const kakaoText = buildKakaoText();

      try {
        await copyToClipboard(kakaoText);
        openKakaoChannel();
        setStatus(`${name} 리딩 + 카톡 문구 생성 + 복사 완료`, 'ok');
      } catch (error) {
        console.error(error);
        setStatus(`${name} 리딩 완료 (복사는 수동 필요)`, 'warn');
      }

      if (id) {
        await loadConsultation();
        renderKakao(kakaoText);
      }
    }

    async function checkAdminAuth() {
      setStatus('관리자 인증 확인 중...');
      const res = await fetch('/api/admin/me', {
        method: 'GET',
        credentials: 'include'
      });

      let data = null;
      try {
        data = await res.json();
      } catch {
        data = null;
      }

      if (!res.ok || !data?.ok) {
        throw new Error(data?.error || '관리자 인증이 만료되었거나 로그인되지 않았어요.');
      }

      setStatus('관리자 인증 정상', 'ok');
    }

    async function logoutAdmin() {
      await postJson('/api/admin/logout', {});
      setStatus('로그아웃 완료', 'ok');
      setTimeout(() => {
        window.location.href = '/admin';
      }, 500);
    }

    function clearAll() {
      state = {
        consultation: null,
        recommendText: '',
        recommendConfig: null,
        drawResult: '',
        finalReading: '',
        kakaoText: '',
      };

      els.consultationId.value = '';
      els.customerName.value = '';
      els.question.value = '';
      els.productKind.value = 'standard';
      els.productName.value = '';

      renderMeta(null);
      renderRecommend('', null);
      renderDraw('');
      renderReading('');
      renderKakao('');
      setStatus('초기화 완료');
    }

    function getIdFromQuery() {
      const url = new URL(window.location.href);
      return url.searchParams.get('id') || '';
    }

    function getAutorunFromQuery() {
      const url = new URL(window.location.href);
      return url.searchParams.get('autorun') || '';
    }

    els.loadConsultationBtn.addEventListener('click', async () => {
      try {
        await loadConsultation();
      } catch (error) {
        console.error(error);
        setStatus(error.message || '상담건 불러오기 실패', 'error');
      }
    });

    els.runAllBtn.addEventListener('click', async () => {
      try {
        await runAll();
      } catch (error) {
        console.error(error);
        setStatus(error.message || '전체 자동 실행 실패', 'error');
      }
    });

    els.recommendBtn.addEventListener('click', async () => {
      try {
        await runRecommendAndSave();
      } catch (error) {
        console.error(error);
        setStatus(error.message || '추천 생성 실패', 'error');
      }
    });

    els.drawBtn.addEventListener('click', async () => {
      try {
        await runDrawAndSave();
      } catch (error) {
        console.error(error);
        setStatus(error.message || '드로우 생성 실패', 'error');
      }
    });

    els.readingBtn.addEventListener('click', async () => {
      try {
        await runReadingAndSave();
      } catch (error) {
        console.error(error);
        setStatus(error.message || '최종 리딩 생성 실패', 'error');
      }
    });

    els.clearBtn.addEventListener('click', clearAll);

    els.copyRecommendBtn.addEventListener('click', async () => {
      try {
        await copyToClipboard(els.recommendPreview.textContent);
        setStatus('추천 결과 복사 완료', 'ok');
      } catch (error) {
        console.error(error);
        setStatus(error.message || '복사 실패', 'error');
      }
    });

    els.copyDrawBtn.addEventListener('click', async () => {
      try {
        await copyToClipboard(els.drawPreview.textContent);
        setStatus('드로우 결과 복사 완료', 'ok');
      } catch (error) {
        console.error(error);
        setStatus(error.message || '복사 실패', 'error');
      }
    });

    els.copyReadingBtn.addEventListener('click', async () => {
      try {
        await copyToClipboard(els.readingPreview.textContent);
        setStatus('최종 리딩 복사 완료', 'ok');
      } catch (error) {
        console.error(error);
        setStatus(error.message || '복사 실패', 'error');
      }
    });

    els.copyKakaoBtn.addEventListener('click', async () => {
      try {
        const text = state.kakaoText || els.kakaoPreview.textContent;
        await copyToClipboard(text);
        setStatus('카톡 문구 복사 완료', 'ok');
      } catch (error) {
        console.error(error);
        setStatus(error.message || '복사 실패', 'error');
      }
    });

    els.openKakaoBtn.addEventListener('click', () => {
      openKakaoChannel();
      setStatus('카카오 채널 창을 열었어요.', 'ok');
    });

    els.checkAuthBtn.addEventListener('click', async () => {
      try {
        await checkAdminAuth();
      } catch (error) {
        console.error(error);
        setStatus(error.message || '관리자 인증 확인 실패', 'error');
      }
    });

    els.logoutBtn.addEventListener('click', async () => {
      try {
        await logoutAdmin();
      } catch (error) {
        console.error(error);
        setStatus(error.message || '로그아웃 실패', 'error');
      }
    });

    window.addEventListener('load', async () => {
      try {
        await checkAdminAuth();

        const id = getIdFromQuery();
        const autorun = getAutorunFromQuery();

        if (id) {
          els.consultationId.value = id;
          await loadConsultation();

          if (autorun === '1') {
            setStatus('상담건 자동 실행 시작...', 'warn');
            await runAll();
          }
        }
      } catch (error) {
        console.error(error);
        setStatus(error.message || '초기 로딩 실패', 'error');
      }
    });
  </script>
</body>
</html>
