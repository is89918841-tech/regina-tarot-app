<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Regina Admin</title>

<style>
body { background:#0b1020; color:#fff; font-family:sans-serif; margin:0; }
.app { padding:20px; }
.btn { padding:10px 14px; border-radius:10px; background:#1a2440; color:#fff; border:none; cursor:pointer; }
.btn.primary { background:#8b5cf6; }
.item { border:1px solid #333; padding:12px; margin-bottom:10px; border-radius:10px; }
</style>
</head>

<body>
<div class="app">

<h1>레지나 관리자</h1>

<div style="margin-bottom:20px;">
  <!-- 🔥 보조앱 직접 연결 -->
  <a class="btn" href="/admin-helper.html" target="_blank">보조앱 열기</a>
</div>

<div id="list"></div>

</div>

<script>

const listEl = document.getElementById('list');

// 🔥 데이터 불러오기
async function load() {
  const res = await fetch('/api/admin/consultations');
  const data = await res.json();

  listEl.innerHTML = '';

  (data.consultations || []).forEach(item => {

    // 🔥 핵심 수정 완료된 URL
    const helperUrl = `/admin-helper.html?id=${encodeURIComponent(item.id)}&autorun=1`;

    const div = document.createElement('div');
    div.className = 'item';

    div.innerHTML = `
      <div><b>${item.name || '이름없음'}</b></div>
      <div style="margin:6px 0;">${(item.question || '').slice(0, 100)}</div>

      <a href="${helperUrl}" target="_blank" class="btn primary">
        자동 실행
      </a>
    `;

    listEl.appendChild(div);
  });
}

load();

</script>
</body>
</html>
